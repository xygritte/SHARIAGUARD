name: Deploy SHARIAGUARD to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate prototype
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          grep -q "SHARIAGUARD" index.html
          grep -q "localStorage" index.html
          grep -q "function runScan" index.html
          grep -q "function review" index.html
          grep -q "function commitRecord" index.html
          grep -q "function audit" index.html
          grep -q "function simulation" index.html
          python3 - <<'PY' > /tmp/shariaguard.js
          from pathlib import Path
          import re
          text = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>([\s\S]*?)</script>", text)
          if not match:
              raise SystemExit("Inline script not found")
          print(match.group(1))
          PY
          node --check /tmp/shariaguard.js
          test "$(grep -o "nav();go('overview');" index.html | wc -l | tr -d ' ')" = "1"
          if grep -q '^[[:space:]]*\.simhero{grid-template-columns:1fr;padding:14px}' index.html; then
            echo "Unexpected global mobile simulation style found."
            exit 1
          fi
          echo "Prototype validation passed."

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
