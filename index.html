<style>

und:rgba(17,23,45,.84);border-radius:16px;padding:20px}.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.ph h3{margin:0;font-size:18px}.sub{font-size:9px;color:#8791ae}.flow{display:flex;gap:8px;align-items:stretch}.flowcard{flex:1;min-height:174px;border:1px solid var(--line);background:#141a31;border-radius:13px;padding:15px;position:relative}.flowcard.human{background:linear-gradient(155deg,rgba(115,211,165,.1),#141a31);border-color:rgba(115,211,165,.22)}.fn{position:absolute;right:11px;top:9px;color:#69728f;font-size:9px}.fi{width:35px;height:35px;border-radius:10px;background:rgba(119,105,255,.12);display:grid;place-items:center;color:#a9a1ff;margin-bottom:15px}.human .fi{background:rgba(115,211,165,.1);color:#7bd9aa}.flowcard h4{font-size:13px;margin:0}.flowcard p{font-size:10px;color:#a6afc8;line-height:1.5}.arrow{align-self:center;color:#5d6680}.split{display:grid;grid-template-columns:1.4fr .6fr;gap:15px}.why{display:grid;grid-template-columns:1fr 1fr;gap:11px}.reason{border:1px solid var(--line);border-radius:11px;background:#13192f;padding:13px}.reason b{font-size:11px}.reason p{font-size:10px;color:#98a2bd;line-height:1.5;margin:7px 0 0}.emph{display:flex;flex-direction:column;justify-content:space-between}.quote{font-size:19px;line-height:1.35;margin:20px 0;color:#e8ebfa}.citation{font-size:9px;color:#8e98b5}.screen{display:grid;grid-template-columns:1.1fr .9fr;padding:0;overflow:hidden}.left,.right{padding:20px}.right{border-left:1px solid var(--line)}textarea{width:100%;min-height:405px;background:#0c1125;color:#dfe4f4;border:1px solid var(--line);border-radius:11px;padding:13px;font-size:11px;line-height:1.75;resize:vertical;outline:0}.editorTindakans{display:flex;justify-content:space-between;margin-top:11px;gap:10px}.score{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}.score strong{font-size:43px;line-height:1}.ring{width:90px;height:90px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;text-align:center;box-shadow:inset 0 0 0 5px rgba(239,143,155,.06);color:#ffafb9}.finding{background:#151b34;border:1px solid var(--line);border-radius:11px;padding:12px;margin:9px 0}.findingtop{display:flex;justify-content:space-between;gap:10px}.finding b{font-size:11px}.finding p{font-size:10px;color:#9da7c0;line-height:1.5;margin:6px 0}.risk{padding:5px 7px;border-radius:99px;font-size:8px;font-weight:800;text-transform:uppercase;background:rgba(239,143,155,.1);color:#ffb0b9;border:1px solid rgba(239,143,155,.2);white-space:nowrap}.ref{display:flex;justify-content:space-between;gap:8px;color:#8e99b6;font-size:8px}.status{font-size:8px;padding:5px 7px;border-radius:99px;background:rgba(241,182,109,.08);color:#f4c884;white-space:nowrap}.status.ok{background:rgba(115,211,165,.08);color:#8de2b6}.status.bad{background:rgba(239,143,155,.08);color:#ffadb8}.info{margin-top:15px;display:flex;gap:9px;background:rgba(119,105,255,.05);border:1px solid rgba(119,105,255,.16);padding:12px;border-radius:11px;color:#b8c1db;font-size:9px;line-height:1.5}.reviewcard{border:1px solid var(--line);background:#13192f;border-radius:13px;padding:15px;margin:11px 0}.reviewtop{display:flex;justify-content:space-between}.case{font-size:8px;color:#7b85a2;letter-spacing:.1em;text-transform:uppercase}.reviewtop h4{font-size:13px;margin:3px 0 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:14px 0}.field{font-size:8px;color:#818ba8;text-transform:uppercase;letter-spacing:.08em}.cols p{font-size:10px;color:#a6afc8;line-height:1.5}.refbox{font-size:8px;color:#99a3bf;border:1px solid var(--line);border-radius:9px;padding:9px}.reviewTindakans{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}.reviewTindakans div{display:flex;gap:7px}.ledgercards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.ledgercard{border:1px solid var(--line);background:#141a31;border-radius:11px;padding:14px}.ledgercard h4{margin:5px 0 2px;font-size:13px}.ledgercard span,.ledgercard small{display:block;font-size:9px;color:#8490ad}.hash{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);background:#0e1328;border-radius:11px;padding:13px;margin-top:13px}.hash label{display:block;color:#808aa7;font-size:8px;text-transform:uppercase}.hash code{display:block;margin-top:5px;color:#b8c2da;font-size:9px;word-break:break-all}.note{font-size:9px;color:#98a2ba;margin:10px 0}.payload{background:#0b1020;border:1px solid var(--line);border-radius:11px;padding:13px;color:#b7c1db;font-size:9px;line-height:1.6;overflow:auto}.warn{margin-top:11px;background:rgba(241,182,109,.05);border:1px solid rgba(241,182,109,.16);border-radius:10px;padding:11px;color:#c9bda8;font-size:9px;line-height:1.5}.auditSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}.search{width:320px;max-width:100%;background:#0e1328;border:1px solid var(--line);border-radius:10px;padding:9px;color:#78829f}.search input{border:0;outline:0;background:transparent;color:#fff;width:100%;font-size:10px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:9px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:9px}th{background:#10152a;color:#78829e;text-transform:uppercase;font-size:8px}td{color:#b8c1d4}tr:last-child td{border-bottom:0}td code{color:#9ea9c5;font-size:8px}.knowl{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.kcard{border:1px solid var(--line);background:#141a31;border-radius:11px;padding:14px}.kicon{font-size:20px}.kcard .case{margin-top:12px}.kcard h4{font-size:13px;margin:5px 0}.kcard code{font-size:8px;color:#a59fff}.kcard p{font-size:9px;color:# rgba(0,0,0,.3)}.toast.show{display:block}.mini-btn{padding:7px 9px;font-size:9px;border-radius:8px}.approval-banner{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid rgba(115,211,165,.18);background:rgba(115,211,165,.05);border-radius:11px;margin:12px 0}.approval-banner b{font-size:10px}.approval-banner span{font-size:9px;color:#9fb7aa}@media(max-width:1100px){

<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="mark">✓</div><div><b>SHARIAGUARD</b><small>Dibantu AI · Ditinjau DPS</small></div></div>
  
  <div class="nav" id="nav"></div>

</aside>
<main class="main">
<header class="top"><div><p class="eyebrow">Pemeriksaan dan pencatatan akad</p><h1 id="pageTitle">Overview</h1></div><div class="actions"><span class="live">Pemeriksaan akad</span><button class="btn primary" onclick="startDemo()">Coba contoh akad</button></div></header>
<div id="content"></div>
</main>
</div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY='shariaguard-prototype-v3';
const demo=`AKAD MUDHARABAH PEMBIAYAAN DIGITAL

Pemilik dana menyediakan modal sebesar Rp20.000.000 kepada pengelola usaha.
Nisbah bagi hasil ditetapkan 60% untuk pemilik dana dan 40% untuk pengelola, disepakati sebelum akad.
Pengelola wajib menyampaikan laporan usaha setiap bulan.
Keterlambatan pembayaran dikenakan biaya administrasi Rp50.000 yang menjadi pendapatan platform.
Para pihak menyetujui akad secara elektronik sebelum pencairan dana.`;

const defaultState={contract:'',selectedAkad:'Mudharabah',screened:{akad:'Belum dipilih',score:100,findings:[]},findings:[],hash:'',status:'KOSONG',events:[],contracts:[],settings:{institution:'SHARIAGUARD',dpsName:'DPS'}};

function loadState(){
  try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)); return x?{...defaultState,...x}:structuredClone(defaultState)}
  catch(e){return structuredClone(defaultState)}
}
let state=loadState();
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setWaktuout(()=>el.classList.remove('show'),2200)}
function norm(s){return String(s||'').toRendaherCase().replace(/\s+/g,' ').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function scan(s){
  const t=norm(s), f=[];
  const mud=/mudharabah|qiradh/.test(t), mur=/murabahah/.test(t), mus=/musyarakah/.test(t);
  if(mud&&!/(nisbah|rasio).{0,80}(hasil|bagi)/.test(t))
    f.push({id:'F-001',issue:'Nisbah bagi hasil belum jelas',severity:'tinggi',clause:'Nisbah bagi hasil belum ditemukan dengan jelas.',exp:'Rasio bagi hasil perlu disepakati sejak awal; bagian ini perlu diperiksa DPS.',ref:'DSN-MUI Fatwa 07/DSN-MUI/IV/2000 tentang Pembiayaan Mudharabah (Qiradh)',status:'menunggu'});
  if(mur&&!/(harga pokok|harga perolehan|cost price)/.test(t))
    f.push({id:'F-003',issue:'Harga pokok belum jelas',severity:'high',clause:'Harga pokok barang belum ditemukan dengan jelas.',exp:'Sistem belum menemukan harga pokok/perolehan dengan jelas.',ref:'DSN-MUI Fatwa 04/DSN-MUI/IV/2000 tentang Murabahah',status:'review'});
  if(/(late fee|biaya keterlambatan|denda keterlambatan|keterlambatan).{0,100}(pendapatan|income|platform)/.test(t))
    f.push({id:'F-002',issue:'Denda keterlambatan menjadi pendapatan',severity:'high',clause:s.split(/\n/).find(x=>/keterlambatan|late fee/i.test(x))||'Klausul biaya keterlambatan',exp:'Klausul menyebut biaya keterlambatan menjadi pendapatan. Bagian ini perlu diperiksa DPS.',ref:'DSN-MUI Fatwa 117/DSN-MUI/II/2018 — layanan pembiayaan berbasis teknologi informasi berdasarkan prinsip Syariah',status:'review'});
  if(/\b(bunga|interest|riba)\b/.test(t))
    f.push({id:'F-004',issue:'Indikasi riba',severity:'high',clause:'Istilah yang berkaitan dengan bunga/riba ditemukan.',exp:'Istilah ini perlu diperiksa bersama konteks akad.',ref:'Aturan yang ditetapkan DPS',status:'review'});
  if(/\b(judi|taruhan|maysir)\b/.test(t))
    f.push({id:'F-005',issue:'Indikasi maysir',severity:'high',clause:'Istilah yang berkaitan dengan perjudian/pertaruhan ditemukan.',exp:'Bagian ini perlu diperiksa DPS.',ref:'Aturan yang ditetapkan DPS',status:'review'});
  if(/tidak jelas|sesuai kesepakatan nanti|akan ditentukan kemudian|tergantung kebijakan/.test(t))
    f.push({id:'F-006',issue:'Indikasi gharar',severity:'sedang',clause:'Ada bagian yang dapat menimbulkan ketidakjelasan.',exp:'Bagian ini perlu diperiksa karena ketentuannya belum jelas.',ref:'Aturan yang ditetapkan DPS',status:'review'});
  const akad=mud?'Mudharabah':mur?'Murabahah':mus?'Musyarakah':'Akad digital';
  const penalty=f.reduce((a,x)=>a+(x.severity==='high'?25:x.severity==='medium'?15:5),0);
  return{akad,score:Math.max(0,100-penalty),findings:f}
}

async function sha(v){
  const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

const tabs=[['overview','▦','Beranda'],['screening','⌕','Periksa Akad'],['review','◉','Pemeriksaan DPS'],['ledger','◈','Catatan Akad'],['audit','≡','Riwayat'],['knowledge','▤','Referensi']];
function nav(){

}
function go(tab){
  document.getElementById('pageTitle').textContent=tabs.find(x=>x[0]===tab)[2];
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));

}

function screening(){
  document.getElementById('content').innerHTML=`<div class="grid"><section class="panel screen">
  <div class="left"><div class="ph"><div><p class="eyebrow">Tahap 1</p><h3>Teks akad</h3></div><span class="pill">Periksa sebelum disetujui</span></div>
  <textarea id="contract">${esc(state.contract)}</textarea>
  <div class="editorTindakans"><button class="btn secondary" onclick="document.getElementById('contract').value=demo">Muat contoh akad</button><button class="btn primary" onclick="runScan()">Periksa akad →</button></div>
  </div>
  <div class="right"><div class="score"><div><p class="eyebrow">Nilai pemeriksaan</p><strong>${state.screened.score}</strong><small>/100</small></div><div class="ring">${esc(state.screened.akad)}</div></div>
  <div class="eyebrow">Temuan</div><div>${renderTemuan(state.screened.findings)}</div>
  <button class="btn secondary" style="width:100%;margin-top:8px" onclick="go('review')">Open Pemeriksaan DPS queue</button></div></section>
  <div class="info">ⓘ <div><b>Catatan.</b> Temuan are indicators for qualified review, not a final Shariah ruling.</div></div></div>`
}
function renderTemuan(fs){
  if(!fs.length)return '<div class="empty">✓ Tidak ada bagian yang ditandai oleh sistem. Keputusan akhir tetap memerlukan pemeriksaan DPS.</div>';
  return fs.map(f=>{
    const st=f.status==='disetujui'?'<span class="status ok">Disetujui</span>':f.status==='ditolak'?'<span class="status bad">Ditolak</span>':'<span class="status">Menunggu DPS</span>';
    return `<div class="finding"><div class="findingtop"><b>${esc(f.issue)}</b><span class="risk">${esc(f.severity==='tinggi'?'tinggi':f.severity==='sedang'?'sedang':'rendah')}</span></div><p>${esc(f.clause)}</p><div class="ref"><span>${esc(f.ref)}</span>${st}</div></div>`
  }).join('')
}
function runScan(){
  state.contract=document.getElementById('contract').value.trim();
  if(!state.contract){toast('Masukkan teks akad terlebih dahulu.');return;}
  state.screened=scan(state.contract);
  state.findings=state.screened.findings;
  state.status='DIPERIKSA';
  state.events.unshift(['EVT-'+String(state.events.length+1).padStart(3,'0'),new Date().toLocaleWaktuString('en-GB'),'AI','Ditandai',state.screened.akad,'—']);
  persist();screening();toast('Pemeriksaan selesai — temuan siap diperiksa DPS.')
}

function review(){
  const fs=state.findings;
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Keputusan manusia</p><h3>Pemeriksaan DPS queue</h3></div><span class="pill">Menunggu keputusan</span></div>
  <div class="info">◉ <div><b>Keputusan DPS.</b> Temuan AI hanya menjadi bahan pemeriksaan. Keputusan akhir tetap pada DPS.</div></div>
  ${fs.length?fs.map(f=>reviewCard(f)).join(''):'<div class="empty">Belum ada akad yang perlu diperiksa. Periksa akad terlebih dahulu.</div>'}</div>`
}
function reviewCard(f){
  return `<article class="reviewcard"><div class="reviewtop"><div><span class="case">${esc(f.id)}</span><h4>${esc(f.issue)}</h4></div><span class="risk">${esc(f.severity)}</span></div>
  <div class="cols"><div><span class="field">Bagian yang ditandai</span><p>${esc(f.clause)}</p></div><div><span class="field">Alasan AI</span><p>${esc(f.exp)}</p></div></div>
  <div class="refbox">${esc(f.ref)}</div>
  <div class="reviewTindakans"><span class="status ${f.status==='approved'?'ok':f.status==='rejected'?'bad':''}">${f.status==='review'?'Menunggu DPS':esc(f.status)}</span>
  <div><button class="btn secondary mini-btn" onclick="rejectFinding('${f.id}')">Tolak</button><button class="btn primary mini-btn" onclick="approveFinding('${f.id}')">Setujui</button></div></div></article>`
}
function rejectFinding(id){
  state.findings=state.findings.map(f=>f.id===id?{...f,status:'ditolak'}:f);
  state.status='DITOLAK';
  state.events.unshift(['EVT-'+String(state.events.length+1).padStart(3,'0'),new Date().toLocaleWaktuString('en-GB'),state.settings.dpsName,'Ditolak',state.screened.akad,'—']);
  persist();review();toast('Penolakan DPS berhasil dicatat.')
}
async function approveFinding(id){
  if(state.findings.some(f=>f.status==='review')){toast('Tinjau semua temuan sebelum menyetujui akad.');return;}
  state.findings=state.findings.map(f=>f.id===id?{...f,status:'disetujui'}:f);
  const h=await sha(state.contract+'|'+id+'|APPROVED|'+Date.now());
  state.hash=h;state.status='DISETUJUI';
  state.events.unshift(['EVT-'+String(state.events.length+1).padStart(3,'0'),new Date().toLocaleWaktuString('en-GB'),state.settings.dpsName,'Disetujui',state.screened.akad,h.slice(0,4)+'…'+h.slice(-4)]);
  const rec=state.contracts.find(c=>c.id==='C-002');
  if(rec){rec.status='Disetujui';rec.risk='Reviewed';rec.hash=h.slice(0,4)+'…'+h.slice(-4)}
  persist();ledger();toast('DPS approval recorded. Akad siap dicatat.')
}

function ledger(){
  const approved=state.findings.length>0 && state.findings.every(f=>f.status==='approved');
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Tahap 2</p><h3>Pencatatan akad enforcement</h3></div><span class="pill">Keutuhan akad</span></div>
  ${approved?'<div class="approval-banner"><div><b>✓ Akad sudah disetujui DPS</b><span>Disetujui findings can now be committed as a local ledger record.</span></div><span class="status ok">SIAP</span></div>':'<div class="info">Belum ada temuan yang disetujui DPS. Kembali ke pemeriksaan DPS.</div>'}
  <div class="ledgercards"><div class="ledgercard"><span>Akad</span><h4>${esc(state.screened.akad)}</h4><small>Disetujui terms only</small></div><div class="ledgercard"><span>Tempat data</span><h4>Perangkat ini</h4><small>Versi demo</small></div><div class="ledgercard"><span>Data pribadi</span><h4>Tidak dicatat di sini</h4><small>Data pribadi tidak disimpan di bagian ini</small></div></div>
  <div class="hash"><div><label>Sidik digital akad</label><code>${state.hash||'Belum dibuat'}</code></div><button class="btn primary" onclick="commitRecord()" ${approved?'':'disabled'}>${state.hash?'Simpan catatan':'Buat & simpan'} →</button></div>
  <div class="note">${state.status==='TERSIMPAN'?'Catatan sudah disimpan di perangkat.':'Sidik digital digunakan untuk mengetahui apakah isi akad berubah.'}</div>
  <div class="ph" style="margin-top:18px"><h3>Ringkasan akad</h3><span class="sub">Data yang akan dicatat</span></div>
  <pre class="payload">${esc(JSON.stringify({akad:state.screened.akad,status:state.status,enforce:['akad_disetujui','bagi_hasil_atau_margin','aturan_denda'],contract_hash:state.hash||'pending'},null,2))}</pre>
  <div class="note">Sidik digital membantu mendeteksi perubahan isi akad. Ini bukan bukti transaksi blockchain.</div></div>`
}
async function commitRecord(){
  if(state.status==='COMMITTED'){toast('Akad ini sudah dicatat.');return;}
  if(!state.findings.length || !state.findings.every(f=>f.status==='approved')){toast('Semua temuan harus disetujui DPS terlebih dahulu.');return;}
  if(!state.hash)state.hash=await sha(state.contract+'|'+state.screened.akad+'|COMMIT|'+Date.now());
  state.status='TERSIMPAN';
  state.events.unshift(['EVT-'+String(state.events.length+1).padStart(3,'0'),new Date().toLocaleWaktuString('en-GB'),'Catatan','Disimpan',state.screened.akad,state.hash.slice(0,4)+'…'+state.hash.slice(-4)]);
  const id='C-'+String(state.contracts.length+1).padStart(3,'0');
  state.contracts.unshift({id,akad:state.screened.akad,status:'Disetujui',risk:'Verified',owner:'Demo',date:new Date().toISOString().slice(0,10),hash:state.hash.slice(0,4)+'…'+state.hash.slice(-4)});
  persist();ledger();toast('Catatan akad berhasil disimpan.')
}

function audit(){
  const q=norm((document.getElementById('auditQ')?.value||''));
  const rows=state.events.filter(e=>!q||norm(e.join(' ')).includes(q));
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Tahap 3</p><h3>Riwayat aktivitas</h3></div><span class="sub">DPS · Pemeriksa</span></div>

  <div class="toolbar"><div class="search">⌕ <input id="auditQ" placeholder="Cari aktivitas" value="${esc(q)}" oninput="audit()"></div><span class="sub">${rows.length} aktivitas</span></div>
  <div class="tablewrap"><table><thead><tr><th>Aktivitas</th><th>Waktu</th><th>Pelaku</th><th>Tindakan</th><th>Akad</th><th>Sidik</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td><code>${esc(r[5])}</code></td></tr>`).join('')}</tbody></table></div>

  <div class="kcard"><div class="kicon">▤</div><span class="case">DSN-MUI</span><h4>Technology-based financing</h4><code>117/DSN-MUI/II/2018</code><p>Digunakan sebagai referensi pada contoh pembiayaan digital.</p><div class="kfoot"><span>Referensi tersedia</span><span>✓</span></div></div></div>
  <div class="info" style="margin-top:15px">▤ <div><b>Saat memeriksa.</b> Pastikan isi fatwa dan arti klausul diperiksa sebelum mengambil keputusan.</div></div></div>`

function newContract(){
  openModal(`<div class="modalhead"><div><p class="eyebrow">Buat akad</p><h3>Akad baru draft</h3></div><button class="x" onclick="closeModal()">✕</button></div>
  <div class="formgrid"><div class="fieldbox"><label>Jenis akad</label><select id="newAkad"><option>Mudharabah</option><option>Murabahah</option><option>Musyarakah</option><option>Akad digital</option></select></div><div class="fieldbox"><label>Pemilik / nasabah</label><input id="newOwner" value="Demo Customer"></div><div class="fieldbox full"><label>Isi akad</label><textarea id="newText">${esc(demo)}</textarea></div></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn secondary" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveNewContract()">Buat & periksa</button></div>`)
}
function saveNewContract(){
  state.contract=document.getElementById('newText').value;
  state.selectedAkad=document.getElementById('newAkad').value;
  state.screened=scan(state.contract);state.findings=state.screened.findings;state.status='DRAFT';
  const id='C-'+String(Math.max(1,state.contracts.length+1)).padStart(3,'0');
  state.contracts.unshift({id,akad:state.screened.akad,status:state.findings.length?'Menunggu DPS':'Siap diperiksa',risk:state.findings.length?'Tinggi':'Rendah',owner:document.getElementById('newOwner').value,date:new Date().toISOString().slice(0,10),hash:'—'});
  state.events.unshift(['EVT-'+String(state.events.length+1).padStart(3,'0'),new Date().toLocaleWaktuString('en-GB'),'Pengguna','Dibuat',state.screened.akad,'—']);
  persist();closeModal();screening();toast('Akad baru dibuat dan disimpan di perangkat.')
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shariaguard-local-data.json';a.click();URL.revokeObjectURL(a.href);
  toast('Data berhasil diekspor.')
}
function resetData(){
  if(!confirm('Hapus semua data demo di perangkat ini?'))return;
  state=structuredClone(defaultState);persist();go('overview');toast('Data demo dikembalikan ke kondisi awal.')
}
function startDemo(){
  state.contract=demo;state.screened=scan(demo);state.findings=state.screened.findings;state.hash='';state.status='SCREENED';persist();go('screening');toast('Contoh akad dimuat. Tekan “Periksa akad” untuk mulai.')
}
nav();go('overview');
