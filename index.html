Pemilik dana menyediakan modal sebesar Rp20.000.000 kepada pengelola usaha.

const defaultState={contract:'',selectedAkad:'Mudharabah',screened:{akad:'Belum dipilih',score:100,findings:[]},findings:[],hash:'',status:'KOSONG',events:[],contracts:[],settings:{institution:'SHARIAGUARD',dpsName:'DPS'},currentContractId:'',contractOwner:'',simulation:{active:false,scenario:'main',step:0}};

function normalizeEvents(events){
  if(!Array.isArray(events))return [];
  return events.map((e,i)=>Array.isArray(e)?{id:e[0]||'EVT-'+String(i+1).padStart(3,'0'),time:e[1]||'—',actor:e[2]||'—',action:e[3]||'—',akad:e[4]||'—',hash:e[5]||'—',contractId:e[6]||'—'}:{id:e.id||'EVT-'+String(i+1).padStart(3,'0'),time:e.time||'—',actor:e.actor||'—',action:e.action||'—',akad:e.akad||'—',hash:e.hash||'—',contractId:e.contractId||'—'});
}
function loadState(){
  try{
    let raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)raw=localStorage.getItem(PREVIOUS_STORAGE_KEY);
    const x=raw?JSON.parse(raw):null;
    if(!x)return structuredClone(defaultState);
    const base=structuredClone(defaultState);
    return {...base,...x,events:normalizeEvents(x.events),screened:{...base.screened,...(x.screened||{})},settings:{...base.settings,...(x.settings||{})},simulation:{...base.simulation,...(x.simulation||{})}};
  }catch(e){return structuredClone(defaultState)}
}
let state=loadState();
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function nextEventId(){return 'EVT-'+String(state.events.length+1).padStart(3,'0')}
function addEvent(actor,action,akad=state.screened.akad,hash='—',contractId=state.currentContractId||'—'){
  state.events.unshift({id:nextEventId(),time:new Date().toLocaleTimeString('id-ID'),actor,action,akad,hash,contractId});
}
function severityLabel(severity){return ({high:'tinggi',medium:'sedang',low:'rendah',tinggi:'tinggi',sedang:'sedang',rendah:'rendah'})[severity]||severity||'rendah'}
function statusLabel(status){return ({review:'Menunggu DPS',approved:'Disetujui',rejected:'Ditolak',DRAFT:'Draf',SCREENED:'Sudah diperiksa',DPS_APPROVED:'Disetujui DPS',DPS_REJECTED:'Ditolak DPS',COMMITTED:'Tersimpan',KOSONG:'Belum ada akad'})[status]||status||'—'}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function scan(s,forcedAkad){
  const t=norm(s), f=[];
  const mud=/mudharabah|qiradh/.test(t), mur=/murabahah/.test(t), mus=/musyarakah/.test(t);
  if(mud&&!/(nisbah|rasio).{0,80}(hasil|bagi)/.test(t))
    f.push({id:'F-001',issue:'Nisbah bagi hasil belum jelas',severity:'medium',clause:'Nisbah bagi hasil belum ditemukan dengan jelas.',exp:'Rasio bagi hasil perlu disepakati sejak awal; bagian ini perlu diperiksa DPS.',ref:'DSN-MUI Fatwa 07/DSN-MUI/IV/2000 tentang Pembiayaan Mudharabah (Qiradh)',status:'review'});
  if(mur&&!/(harga pokok|harga perolehan|cost price)/.test(t))
    f.push({id:'F-003',issue:'Harga pokok belum jelas',severity:'high',clause:'Harga pokok barang belum ditemukan dengan jelas.',exp:'Sistem belum menemukan harga pokok/perolehan dengan jelas.',ref:'DSN-MUI Fatwa 04/DSN-MUI/IV/2000 tentang Murabahah',status:'review'});
  if(/(late fee|biaya keterlambatan|denda keterlambatan|keterlambatan).{0,100}(pendapatan|income|platform)/.test(t))
    f.push({id:'F-002',issue:'Denda keterlambatan menjadi pendapatan',severity:'high',clause:s.split(/\n/).find(x=>/keterlambatan|late fee/i.test(x))||'Klausul biaya keterlambatan',exp:'Klausul menyebut biaya keterlambatan menjadi pendapatan. Bagian ini perlu diperiksa DPS.',ref:'DSN-MUI Fatwa 117/DSN-MUI/II/2018 — layanan pembiayaan berbasis teknologi informasi berdasarkan prinsip Syariah',status:'review'});
  if(/\b(bunga|interest|riba)\b/.test(t))
    f.push({id:'F-004',issue:'Indikasi riba',severity:'high',clause:'Istilah yang berkaitan dengan bunga/riba ditemukan.',exp:'Istilah ini perlu diperiksa bersama konteks akad.',ref:'Aturan yang ditetapkan DPS',status:'review'});
  if(/\b(judi|taruhan|maysir)\b/.test(t))
    f.push({id:'F-005',issue:'Indikasi maysir',severity:'high',clause:'Istilah yang berkaitan dengan perjudian/pertaruhan ditemukan.',exp:'Bagian ini perlu diperiksa DPS.',ref:'Aturan yang ditetapkan DPS',status:'review'});
  if(/tidak jelas|sesuai kesepakatan nanti|akan ditentukan kemudian|tergantung kebijakan/.test(t))
    f.push({id:'F-006',issue:'Indikasi gharar',severity:'sedang',clause:'Ada bagian yang dapat menimbulkan ketidakjelasan.',exp:'Bagian ini perlu diperiksa karena ketentuannya belum jelas.',ref:'Aturan yang ditetapkan DPS',status:'review'});
  const akad=forcedAkad|| (mud?'Mudharabah':mur?'Murabahah':mus?'Musyarakah':'Akad digital');
  const penalty=f.reduce((a,x)=>a+(x.severity==='high'?25:x.severity==='medium'?15:5),0);
  return{akad,score:Math.max(0,100-penalty),findings:f}
}

async function sha(v){
  const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

const tabs=[['overview','▦','Beranda'],['simulation','▷','Simulasi'],['screening','⌕','Periksa Akad'],['review','◉','Pemeriksaan DPS'],['ledger','◈','Catatan Akad'],['audit','≡','Riwayat'],['knowledge','▤','Referensi']];
function nav(){
  document.getElementById('nav').innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" onclick="go('${t[0]}')"><b>${t[1]}</b><span>${t[2]}</span></button>`).join('');
}
function go(tab){
  document.getElementById('pageTitle').textContent=tabs.find(x=>x[0]===tab)[2];
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
  ({overview,simulation,screening,review,ledger,audit,knowledge}[tab]||overview)();
}

function screening(){
  document.getElementById('content').innerHTML=`<div class="grid"><section class="panel screen">
  <div class="left"><div class="ph"><div><p class="eyebrow">Tahap 1</p><h3>Teks akad</h3></div><span class="pill">Periksa sebelum disetujui</span></div>
  <textarea id="contract">${esc(state.contract)}</textarea>
  <div class="editorActions"><button class="btn secondary" onclick="document.getElementById('contract').value=demo">Muat contoh akad</button><button class="btn primary" onclick="runScan()">Periksa akad →</button></div>
  </div>
  <div class="right"><div class="score"><div><p class="eyebrow">Nilai pemeriksaan</p><strong>${state.screened.score}</strong><small>/100</small></div><div class="ring">${esc(state.screened.akad)}</div></div>
  <div class="eyebrow">Temuan</div><div>${renderTemuan(state.screened.findings)}</div>
  <button class="btn secondary" style="width:100%;margin-top:8px" onclick="go('review')">Buka pemeriksaan DPS</button></div></section>
  <div class="info">ⓘ <div><b>Catatan.</b> Temuan membantu pemeriksaan, bukan keputusan akhir.</div></div></div>`

function renderTemuan(fs){
  if(!fs.length)return '<div class="empty">✓ Tidak ada bagian yang ditandai oleh sistem. Keputusan akhir tetap memerlukan pemeriksaan DPS.</div>';
  return fs.map(f=>{
    const st=f.status==='approved'?'<span class="status ok">Disetujui</span>':f.status==='rejected'?'<span class="status bad">Ditolak</span>':'<span class="status">Menunggu DPS</span>';
    return `<div class="finding"><div class="findingtop"><b>${esc(f.issue)}</b><span class="risk">${esc(severityLabel(f.severity))}</span></div><p>${esc(f.clause)}</p><div class="ref"><span>${esc(f.ref)}</span>${st}</div></div>`
  }).join('')
}
function runScan(){
  state.contract=document.getElementById('contract').value.trim();
  if(!state.contract){toast('Masukkan teks akad terlebih dahulu.');return;}
  state.screened=scan(state.contract,state.selectedAkad);
  state.findings=state.screened.findings;
  state.hash='';
  state.currentContractId='';
  state.status='SCREENED';
  addEvent('AI','Ditandai',state.screened.akad,'—','—');
  if(state.simulation.active)state.simulation.step=2;
  persist();screening();toast(state.findings.length?`Pemeriksaan selesai — ${state.findings.length} temuan siap diperiksa DPS.`:'Pemeriksaan selesai — tidak ada bagian yang ditandai.')
}
function review(){
  const fs=state.findings;
  const approved=fs.length>0&&fs.every(f=>f.status==='approved');
  const rejected=fs.some(f=>f.status==='rejected');
  const header=approved?'Disetujui':rejected?'Ada penolakan':'Menunggu keputusan';
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Keputusan DPS</p><h3>Pemeriksaan DPS</h3></div><span class="pill">${header}</span></div>
  <div class="info">◉ <div><b>Keputusan DPS.</b> Temuan sistem hanya menjadi bahan pemeriksaan. Keputusan akhir tetap pada DPS.</div></div>
  ${fs.length?fs.map(f=>reviewCard(f)).join(''):'<div class="empty">Belum ada temuan dari pemeriksaan. Periksa akad terlebih dahulu untuk mendapatkan bahan pemeriksaan DPS.</div>'}
  ${!fs.length&&state.status==='SCREENED'?'<div class="reviewActions"><span class="sub">Tidak ada temuan.</span><button class="btn primary" onclick="approveAkad()">Setujui akad</button></div>':''}
  ${approved?'<div class="approval-banner"><div><b>✓ Semua bagian telah disetujui DPS.</b><span>Akad siap masuk ke Catatan Akad.</span></div><button class="btn primary mini-btn" onclick="go(\'ledger\')">Buka catatan akad →</button></div>':''}
  ${rejected?'<div class="info">✕ <div><b>Akad belum dapat dicatat.</b> Ada bagian yang ditolak DPS. Periksa ulang isi akad atau mulai akad baru.</div></div>':''}
  </div>`
}
function reviewCard(f){
  const processed=f.status!=='review';
  return `<article class="reviewcard"><div class="reviewtop"><div><span class="case">${esc(f.id)}</span><h4>${esc(f.issue)}</h4></div><span class="risk">${esc(severityLabel(f.severity))}</span></div>
  <div class="cols"><div><span class="field">Bagian yang ditandai</span><p>${esc(f.clause)}</p></div><div><span class="field">Alasan sistem</span><p>${esc(f.exp)}</p></div></div>
  <div class="refbox">${esc(f.ref)}</div>
  <div class="reviewActions"><span class="status ${f.status==='approved'?'ok':f.status==='rejected'?'bad':''}">${esc(statusLabel(f.status))}</span>
  <div>${processed?'<span class="sub">Tindakan sudah dicatat.</span>':`<button class="btn secondary mini-btn" onclick="rejectFinding('${f.id}')">Tolak</button><button class="btn primary mini-btn" onclick="approveFinding('${f.id}')">Setujui</button>`}</div></div></article>`
}
function rejectFinding(id){
  const target=state.findings.find(f=>f.id===id);
  if(!target||target.status!=='review'){toast('Bagian ini sudah diproses.');return;}
  state.findings=state.findings.map(f=>f.id===id?{...f,status:'rejected'}:f);
  state.status='DPS_REJECTED';
  state.hash='';
  addEvent(state.settings.dpsName,'Ditolak',state.screened.akad,'—',state.currentContractId||'—');
  if(state.simulation.active&&state.simulation.scenario==='problem')state.simulation.step=3;
  persist();
  if(state.simulation.active&&state.simulation.scenario==='problem'){ledger();toast('Penolakan DPS berhasil dicatat. Pencatatan akad diblokir.');}
  else{review();toast('Penolakan DPS berhasil dicatat.');}
}
function approveAkad(){
  if(state.status!=='SCREENED'||state.findings.length){toast('Tidak ada akad tanpa temuan yang dapat disetujui pada tahap ini.');return;}
  state.status='DPS_APPROVED';
  state.hash='';
  addEvent(state.settings.dpsName,'Disetujui',state.screened.akad,'—',state.currentContractId||'—');
  if(state.simulation.active)state.simulation.step=3;
  persist();ledger();toast('Akad disetujui DPS dan siap dicatat.')
}
async function approveFinding(id){
  const target=state.findings.find(f=>f.id===id);
  if(!target || target.status!=='review'){toast('Bagian ini sudah diproses.');return;}
  state.findings=state.findings.map(f=>f.id===id?{...f,status:'approved'}:f);
  state.status='DPS_APPROVED';
  state.hash='';
  addEvent(state.settings.dpsName,'Disetujui',state.screened.akad,'—',state.currentContractId||'—');
  const allApproved=state.findings.length>0 && state.findings.every(f=>f.status==='approved');
  if(allApproved){
    if(state.simulation.active&&state.simulation.scenario==='main')state.simulation.step=3;
    persist();ledger();toast('Semua bagian disetujui DPS.');
  }else{
    persist();review();toast('Bagian disetujui. Lanjutkan pemeriksaan.');
  }
}
function ledger(){
  const rejected=state.findings.some(f=>f.status==='rejected')||state.status==='DPS_REJECTED';
  const approved=state.status==='DPS_APPROVED' && (!state.findings.length || state.findings.every(f=>f.status==='approved'));
  const committed=state.status==='COMMITTED';
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Tahap 2</p><h3>Pencatatan akad</h3></div><span class="pill">Keutuhan akad</span></div>
  ${approved||committed?'<div class="approval-banner"><div><b>✓ Akad sudah disetujui DPS</b><span>Hasil pemeriksaan dapat dicatat di perangkat.</span></div><span class="status ok">SIAP</span></div>':rejected?'<div class="info">✕ <div><b>Pencatatan diblokir.</b> Ada bagian yang ditolak DPS. Periksa ulang akad sebelum menyimpannya.</div></div>':'<div class="info">Belum ada keputusan DPS yang siap dicatat. Kembali ke pemeriksaan DPS.</div>'}
  <div class="ledgercards"><div class="ledgercard"><span>Akad</span><h4>${esc(state.screened.akad)}</h4><small>Hanya akad yang lolos pemeriksaan DPS</small></div><div class="ledgercard"><span>Pemilik / nasabah</span><h4>${esc(state.contractOwner||'—')}</h4><small>Identitas hanya contoh di perangkat demo</small></div><div class="ledgercard"><span>Tempat data</span><h4>Perangkat ini</h4><small>Disimpan di browser</small></div></div>
  <div class="hash"><div><label>Sidik digital akad</label><code>${state.hash||'Belum dibuat'}</code></div><button class="btn primary" onclick="commitRecord()" ${approved&&!committed?'':'disabled'}>${committed?'Sudah tersimpan':state.hash?'Simpan catatan':'Buat & simpan'} →</button></div>
  <div class="note">${committed?'Catatan sudah disimpan di perangkat.':'Sidik digital membantu mengetahui apakah isi akad berubah setelah dicatat.'}</div>
  <div class="reviewActions" style="margin-top:14px"><span class="sub">Lanjutkan alur</span><div>${rejected?'<button class="btn secondary mini-btn" onclick="go(\'screening\')">Periksa ulang</button>':''}<button class="btn secondary mini-btn" onclick="go(\'audit\')">Lihat riwayat →</button></div></div>
</div></div>`
}
async function commitRecord(){
  if(state.status==='COMMITTED'||state.currentContractId){toast('Akad ini sudah dicatat.');return;}
  if(state.status!=='DPS_APPROVED'||(state.findings.length && !state.findings.every(f=>f.status==='approved'))){toast('Keputusan DPS belum lengkap. Semua temuan harus disetujui terlebih dahulu.');return;}
  if(!state.hash)state.hash=await sha(state.contract+'|'+state.screened.akad+'|COMMIT|'+Date.now());
  state.status='COMMITTED';
  const id='C-'+String(state.contracts.length+1).padStart(3,'0');
  state.currentContractId=id;
  const shortHash=state.hash.slice(0,4)+'…'+state.hash.slice(-4);
  addEvent('Catatan','Disimpan',state.screened.akad,shortHash,id);
  state.contracts.unshift({id,akad:state.screened.akad,status:'Disetujui',risk:'Terverifikasi',owner:state.contractOwner||'—',date:new Date().toISOString().slice(0,10),hash:shortHash});
  if(state.simulation.active&&state.simulation.scenario==='main')state.simulation.step=4;
  persist();ledger();toast('Catatan akad berhasil disimpan.')
}
function audit(){
  if(state.simulation.active&&state.simulation.scenario==='problem'&&state.status==='DPS_REJECTED'&&state.simulation.step<4){
    state.simulation.step=4;
    persist();
  }
  const q=norm((document.getElementById('auditQ')?.value||''));
  const rows=state.events.filter(e=>!q||norm([e.id,e.time,e.actor,e.action,e.akad,e.hash,e.contractId].join(' ')).includes(q));
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Tahap 3</p><h3>Riwayat aktivitas</h3></div><span class="sub">DPS · Pemeriksa</span></div>
  <div class="auditSummary"><div class="metric"><div class="mi">⌕</div><div><label>Aktivitas</label><strong>${state.events.length}</strong><small>Perangkat ini</small></div></div><div class="metric"><div class="mi">✓</div><div><label>Akad tersimpan</label><strong>${state.events.filter(e=>e.action==='Disimpan').length}</strong><small>Catatan akad</small></div></div><div class="metric"><div class="mi">!</div><div><label>Temuan</label><strong>${state.findings.length}</strong><small>Akad saat ini</small></div></div></div>
  <div class="toolbar"><div class="search">⌕ <input id="auditQ" placeholder="Cari aktivitas" value="${esc(q)}" oninput="audit()"></div><span class="sub">${rows.length} aktivitas</span></div>
  <div class="tablewrap"><table><thead><tr><th>Aktivitas</th><th>Waktu</th><th>Pelaku</th><th>Tindakan</th><th>Akad</th><th>ID catatan</th><th>Sidik</th></tr></thead><tbody>
  ${rows.length?rows.map(r=>`<tr><td><b>${esc(r.id)}</b></td><td>${esc(r.time)}</td><td>${esc(r.actor)}</td><td>${esc(r.action)}</td><td>${esc(r.akad)}</td><td>${esc(r.contractId)}</td><td><code>${esc(r.hash)}</code></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">Belum ada aktivitas yang cocok.</div></td></tr>'}</tbody></table></div>
  <div class="info">🔎 <div><b>Riwayat.</b> Riwayat aktivitas menampilkan siapa yang melakukan tindakan, apa tindakannya, akad yang diproses, dan ID catatannya.</div></div></div>`
}
function knowledge(){
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Referensi</p><h3>Referensi yang digunakan</h3></div><span class="pill">Daftar referensi</span></div>
  <div class="knowl"><div class="kcard"><div class="kicon">▤</div><span class="case">DSN-MUI</span><h4>Murabahah</h4><code>04/DSN-MUI/IV/2000</code><p>Digunakan untuk pemeriksaan harga pokok dan margin.</p><div class="kfoot"><span>Referensi tersedia</span><span>↗</span></div></div>
  <div class="kcard"><div class="kicon">▤</div><span class="case">DSN-MUI</span><h4>Mudharabah</h4><code>07/DSN-MUI/IV/2000</code><p>Digunakan untuk pemeriksaan nisbah bagi hasil.</p><div class="kfoot"><span>Referensi tersedia</span><span>✓</span></div></div>
  <div class="kcard"><div class="kicon">▤</div><span class="case">DSN-MUI</span><h4>Pembiayaan berbasis teknologi</h4><code>117/DSN-MUI/II/2018</code><p>Digunakan sebagai referensi pada contoh pembiayaan digital.</p><div class="kfoot"><span>Referensi tersedia</span><span>✓</span></div></div></div>
  <div class="info" style="margin-top:15px">▤ <div><b>Saat memeriksa.</b> Pastikan isi fatwa dan arti klausul diperiksa sebelum mengambil keputusan.</div></div></div>`
}

function newContract(){
  openModal(`<div class="modalhead"><div><p class="eyebrow">Buat akad</p><h3>Akad baru</h3></div><button class="x" onclick="closeModal()">✕</button></div>
  <div class="formgrid"><div class="fieldbox"><label>Jenis akad</label><select id="newAkad"><option>Mudharabah</option><option>Murabahah</option><option>Musyarakah</option><option>Akad digital</option></select></div><div class="fieldbox"><label>Pemilik / nasabah</label><input id="newOwner" value="Contoh nasabah"></div><div class="fieldbox full"><label>Isi akad</label><textarea id="newText">${esc(demo)}</textarea></div></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn secondary" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveNewContract()">Buat akad</button></div>`)
}
function saveNewContract(){
  const text=document.getElementById('newText').value.trim();
  if(!text){toast('Isi akad belum diisi.');return;}
  state.contract=text;
  state.selectedAkad=document.getElementById('newAkad').value;
  state.contractOwner=document.getElementById('newOwner').value.trim()||'—';
  state.currentContractId='';
  state.hash='';
  state.screened={akad:state.selectedAkad,score:100,findings:[]};
  state.findings=[];
  state.status='DRAFT';
  addEvent('Pengguna','Dibuat',state.selectedAkad,'—','—');
  state.simulation={active:false,scenario:'main',step:0};
  persist();closeModal();screening();toast('Akad baru dibuat. Tekan “Periksa akad” untuk memulai pemeriksaan.')
}

const problemDemo=`AKAD MURABAHAH PEMBIAYAAN DIGITAL

Lembaga menjual barang kepada nasabah secara tangguh dengan margin yang disepakati.
Nasabah menyatakan setuju membeli barang secara elektronik.
Pembayaran dilakukan dalam beberapa kali angsuran sesuai jadwal.
`;
function startDemo(){beginScenario('main')}
function beginScenario(scenario){
  const isProblem=scenario==='problem';
  state.contract=isProblem?problemDemo:demo;
  state.selectedAkad=isProblem?'Murabahah':'Mudharabah';
  state.screened={akad:state.selectedAkad,score:100,findings:[]};
  state.findings=[];
  state.hash='';
  state.status='DRAFT';
  state.currentContractId='';
  state.contractOwner=isProblem?'Contoh nasabah (Kasus 2)':'Contoh nasabah';
  state.simulation={active:true,scenario,step:1};
  addEvent('Pengguna','Dibuat',state.selectedAkad,'—','—');
  persist();go('screening');toast(isProblem?'Kasus masalah Murabahah dimuat.':'Contoh utama dimuat. Tekan “Periksa akad” untuk mulai.');
}
function simulation(){
  const active=state.simulation.active;
  const scenario=state.simulation.scenario||'main';
  const isProblem=scenario==='problem';
  const steps=isProblem?[
    ['01','Buat kasus Murabahah','Akad dibuat dengan satu bagian penting yang belum dijelaskan.'],
    ['02','Periksa akad','Sistem mencari bagian yang perlu diperiksa.'],
    ['03','Keputusan DPS','DPS menolak temuan yang tidak dapat disetujui.'],
    ['04','Catatan diblokir','Pencatatan akad harus berhenti sampai akad diperbaiki.'],
    ['05','Riwayat','Penolakan tetap tercatat di riwayat aktivitas.']
  ]:[
    ['01','Muat akad Mudharabah','Contoh akad pembiayaan digital dimuat sebagai bahan simulasi.'],
    ['02','Periksa akad','Sistem menandai klausul biaya keterlambatan yang menjadi pendapatan platform.'],
    ['03','Keputusan DPS','DPS menilai temuan dan menyetujui bagian yang ditandai.'],
    ['04','Catatan akad','Akad yang sudah disetujui diberi sidik digital dan disimpan.'],
    ['05','Riwayat','Aktivitas pemeriksaan dan pencatatan dapat ditelusuri kembali.']
  ];
  const current=Math.min(Math.max(Number(state.simulation.step||0),0),4);
  const progress=active?Math.round((current/4)*100):0;
  document.getElementById('content').innerHTML=`<div class="grid"><section class="panel"><div class="ph"><div><p class="eyebrow">Mode demo</p><h3>Simulasi lengkap SHARIAGUARD</h3><span class="sub">Gunakan mode ini saat presentasi untuk menunjukkan alur dari akad sampai riwayat.</span></div><span class="pill">${active?(isProblem?'Kasus 2 · perlu perbaikan':'Kasus 1 · alur berhasil'):'Belum dimulai'}</span></div>
  <div class="simhero"><div><span class="pill">${isProblem?'Kasus masalah':'Skenario utama'}</span><h2>${isProblem?'Menemukan klausul penting sebelum akad dicatat.':'Memastikan akad pembiayaan digital diperiksa sebelum disetujui.'}</h2><p>${isProblem?'Akad Murabahah sengaja dibuat tanpa harga pokok agar terlihat bagaimana sistem mengarahkan pemeriksaan DPS dan memblokir pencatatan.':'Akad Mudharabah memuat nisbah yang jelas, tetapi juga memiliki klausul biaya keterlambatan yang menjadi pendapatan platform. Sistem menandai klausul tersebut untuk dinilai DPS.'}</p></div><div class="simscore"><strong>${progress}%</strong><span>progres demo</span></div></div>
  <div class="simcards">${steps.map((s,i)=>`<div class="simrow ${i<current?'done':i===current?'current':''}"><span>${s[0]}</span><div><b>${s[1]}</b><small>${s[2]}</small></div><em>${i<current?'✓':i===current?'Saat ini':'•'}</em></div>`).join('')}</div>
  <div class="simactions"><button class="btn primary" onclick="beginScenario('main')">Mulai skenario utama</button><button class="btn secondary" onclick="beginScenario('problem')">Mulai kasus masalah</button>${active&&current>=4?'<button class="btn secondary" onclick="go(\'audit\')">Buka riwayat →</button>':''}</div></section>
  <section class="split"><div class="panel"><div class="ph"><div><p class="eyebrow">Cara presentasi</p><h3>Urutan demo</h3></div></div><div class="why"><div class="reason"><b>1 · Periksa</b><p>Tekan Periksa Akad dan tunjukkan nilai serta temuan sistem.</p></div><div class="reason"><b>2 · Jelaskan</b><p>Buka Referensi untuk menunjukkan dasar pemeriksaan yang dipakai.</p></div><div class="reason"><b>3 · Putuskan</b><p>Masuk ke Pemeriksaan DPS dan pilih Setujui atau Tolak.</p></div><div class="reason"><b>4 · Catat</b><p>Buka Catatan Akad, buat sidik digital, lalu simpan hasil.</p></div></div></div><div class="panel emph"><div class="ph"><h3>Prinsip demo</h3><span>✓</span></div><div class="quote">Sistem membantu menemukan bagian yang perlu diperiksa. DPS tetap menjadi pengambil keputusan.</div><span class="citation">Gunakan dua skenario untuk menunjukkan jalur berhasil dan jalur penolakan.</span></div></section></div>`;
}

nav();go('overview');
</script>
