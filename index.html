:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}.btn{border:1px solid transparent;border-radius:10px;padding:10px 13px;font-size:11px;font-weight:700}.primary{color:#fff;background:linear-gradient(135deg,#7d70ff,#5a53c8);box-shadow:0 10px 24px rgba(119,105,255,.16)}.secondary{color:#c8cee1;background:#191f39;border-color:var(--line)}.grid{display:grid;gap:15px}.hero{min-height:355px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at 82% 38%,rgba(119,105,255,.21),transparent 23%),linear-gradient(135deg,#151b35,#0d1225 70%);padding:30px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;overflow:hidden}.pill{display:inline-block;font-size:9px;color:#d0ccff;border:1px solid rgba(119,105,255,.25);background:rgba(119,105,255,.13);padding:6px 9px;border-radius:99px}.hero h2{font-size:36px;line-height:1.07;letter-spacing:-.035em;max-width:650px;margin:14px 0}.hero p{max-width:650px;color:#adb6cf;font-size:13px;line-height:1.65}.hero .actions2{display:flex;gap:9px;margin-top:18px}.orbit{position:relative;width:280px;height:280px;margin:auto;display:grid;place-items:center}.orb{position:absolute;inset:35px;border:1px dashed rgba(140,151,190,.27);border-radius:50%}.orb.b{inset:65px;border-style:solid;opacity:.5}.core{width:92px;height:92px;border-radius:27px;background:linear-gradient(145deg,#7b6cff,#5148c7);display:grid;place-items:center;font-size:35px;box-shadow:0 0 60px rgba(119,105,255,.3)}.node{position:absolute;background:#171d38;border:1px solid var(--line);padding:7px 9px;border-radius:8px;font-size:8px;font-weight:800;letter-spacing:.1em}.a{top:18px}.b2{right:4px;top:110px}.c{bottom:18px}.d{left:4px;top:110px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.metric{border:1px solid var(--line);background:rgba(17,23,45,.88);border-radius:13px;padding:14px;display:flex;gap:10px}.mi{width:32px;height:32px;border-radius:10px;background:rgba(119,105,255,.12);display:grid;place-items:center;color:#aba3ff}.metric label{display:block;font-size:9px;color:var(--muted)}.metric strong{display:block;font-size:23px;margin:2px 0}.metric small{display:block;font-size:9px;color:#7f89a6}.panel{border:1px solid var(--line);background:rgba(17,23,45,.84);border-radius:16px;padding:20px}.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.ph h3{margin:0;font-size:18px}.sub{font-size:9px;color:#8791ae}.flow{display:flex;gap:8px;align-items:stretch}.flowcard{flex:1;min-height:174px;border:1px solid var(--line);background:#141a31;border-radius:13px;padding:15px;position:relative}.flowcard.human{background:linear-gradient(155deg,rgba(115,211,165,.1),#141a31);border-color:rgba(115,211,165,.22)}.fn{position:absolute;right:11px;top:9px;color:#69728f;font-size:9px}.fi{width:35px;height:35px;border-radius:10px;background:rgba(119,105,255,.12);display:grid;place-items:center;color:#a9a1ff;margin-bottom:15px}.human .fi{background:rgba(115,211,165,.1);color:#7bd9aa}.flowcard h4{font-size:13px;margin:0}.flowcard p{font-size:10px;color:#a6afc8;line-height:1.5}.arrow{align-self:center;color:#5d6680}.split{display:grid;grid-template-columns:1.4fr .6fr;gap:15px}.why{display:grid;grid-template-columns:1fr 1fr;gap:11px}.reason{border:1px solid var(--line);border-radius:11px;background:#13192f;padding:13px}.reason b{font-size:11px}.reason p{font-size:10px;color:#98a2bd;line-height:1.5;margin:7px 0 0}.emph{display:flex;flex-direction:column;justify-content:space-between}.quote{font-size:19px;line-height:1.35;margin:20px 0;color:#e8ebfa}.citation{font-size:9px;color:#8e98b5}.screen{display:grid;grid-template-columns:1.1fr .9fr;padding:0;overflow:hidden}.left,.right{padding:20px}.right{border-left:1px solid var(--line)}textarea{width:100%;min-height:405px;background:#0c1125;color:#dfe4f4;border:1px solid var(--line);border-radius:11px;padding:13px;font-size:11px;line-height:1.75;resize:vertical;outline:0}.editorActions{display:flex;justify-content:space-between;margin-top:11px}.score{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}.score strong{font-size:43px;line-height:1}.ring{width:90px;height:90px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;text-align:center;box-shadow:inset 0 0 0 5px rgba(239,143,155,.06);color:#ffafb9}.finding{background:#151b34;border:1px solid var(--line);border-radius:11px;padding:12px;margin:9px 0}.findingtop{display:flex;justify-content:space-between;gap:10px}.finding b{font-size:11px}.finding p{font-size:10px;color:#9da7c0;line-height:1.5;margin:6px 0}.risk{padding:5px 7px;border-radius:99px;font-size:8px;font-weight:800;text-transform:uppercase;background:rgba(239,143,155,.1);color:#ffb0b9;border:1px solid rgba(239,143,155,.2);white-space:nowrap}.ref{display:flex;justify-content:space-between;gap:8px;color:#8e99b6;font-size:8px}.status{font-size:8px;padding:5px 7px;border-radius:99px;background:rgba(241,182,109,.08);color:#f4c884;white-space:nowrap}.info{margin-top:15px;display:flex;gap:9px;background:rgba(119,105,255,.05);border:1px solid rgba(119,105,255,.16);padding:12px;border-radius:11px;color:#b8c1db;font-size:9px;line-height:1.5}.reviewcard{border:1px solid var(--line);background:#13192f;border-radius:13px;padding:15px;margin:11px 0}.reviewtop{display:flex;justify-content:space-between}.case{font-size:8px;color:#7b85a2;letter-spacing:.1em;text-transform:uppercase}.reviewtop h4{font-size:13px;margin:3px 0 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:14px 0}.field{font-size:8px;color:#818ba8;text-transform:uppercase;letter-spacing:.08em}.cols p{font-size:10px;color:#a6afc8;line-height:1.5}.refbox{font-size:8px;color:#99a3bf;border:1px solid var(--line);border-radius:9px;padding:9px}.reviewActions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.reviewActions div{display:flex;gap:7px}.ledgercards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.ledgercard{border:1px solid var(--line);background:#141a31;border-radius:11px;padding:14px}.ledgercard h4{margin:5px 0 2px;font-size:13px}.ledgercard span,.ledgercard small{display:block;font-size:9px;color:#8490ad}.hash{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);background:#0e1328;border-radius:11px;padding:13px;margin-top:13px}.hash label{display:block;color:#808aa7;font-size:8px;text-transform:uppercase}.hash code{display:block;margin-top:5px;color:#b8c2da;font-size:9px;word-break:break-all}.note{font-size:9px;color:#98a2ba;margin:10px 0}.payload{background:#0b1020;border:1px solid var(--line);border-radius:11px;padding:13px;color:#b7c1db;font-size:9px;line-height:1.6;overflow:auto}.warn{margin-top:11px;background:rgba(241,182,109,.05);border:1px solid rgba(241,182,109,.16);border-radius:10px;padding:11px;color:#c9bda8;font-size:9px;line-height:1.5}.auditSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}.search{width:320px;max-width:100%;background:#0e1328;border:1px solid var(--line);border-radius:10px;padding:9px;color:#78829f}.search input{border:0;outline:0;background:transparent;color:#fff;width:100%;font-size:10px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:9px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:9px}th{background:#10152a;color:#78829e;text-transform:uppercase;font-size:8px}td{color:#b8c1d4}tr:last-child td{border-bottom:0}td code{color:#9ea9c5;font-size:8px}.knowl{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.kcard{border:1px solid var(--line);background:#141a31;border-radius:11px;padding:14px}.kicon{font-size:20px}.kcard .case{margin-top:12px}.kcard h4{font-size:13px;margin:5px 0}.kcard code{font-size:8px;color:#a59fff}.kcard p{font-size:9px;color:#99a4bf;line-height:1.5;min-height:55px}.kfoot{border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;font-size:8px;color:#7f89a4}.hide{display:none}
@media(max-width:1000px){.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px);padding:20px}.hero{grid-template-columns:1fr}.orbit{display:none}.metrics{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.screen{grid-template-columns:1fr}.right{border-left:0;border-top:1px solid var(--line)}.flow{flex-wrap:wrap}.arrow{display:none}.flowcard{min-width:230px}.knowl{grid-template-columns:1fr}}
@media(max-width:680px){.side{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}.app{display:block}.main{width:100%;margin:0;padding:15px}.tag,.sidefoot,.brand small{display:none}.nav{grid-template-columns:repeat(6,1fr)}.nav button{justify-content:center;padding:10px}.nav button span{display:none}.brand{justify-content:center}.brand b{display:none}.top{align-items:flex-start;gap:10px}.live{display:none}.metrics,.why,.ledgercards,.auditSummary,.cols{grid-template-columns:1fr}.hero{padding:21px}.hero h2{font-size:28px}.hash{flex-direction:column;align-items:flex-start}}

<body>
<div class="app">
<aside class="side"><div class="brand"><div class="mark">✓</div><div><b>SHARIAGUARD</b><small>Scholar-Led · AI-Screened</small></div></div><div class="tag">“Guarding trust, one akad at a time.”</div><div class="nav" id="nav"></div><div class="sidefoot"><span>🔒</span><div><b>Permissioned prototype</b><small>Role-based presentation demo</small></div></div></aside>
<main class="main"><header class="top"><div><p class="eyebrow">Islamic fintech · Digital Shariah governance</p><h1 id="pageTitle">Overview</h1></div><div class="actions"><span class="live">Prototype Live</span><button class="btn primary" onclick="go('screening')">▶ Run demo</button></div></header><div id="content"></div></main>
</div>
<script>
const demo=`AKAD MUDHARABAH PEMBIAYAAN DIGITAL\n\nPemilik dana menyediakan modal sebesar Rp20.000.000 kepada pengelola usaha.\nNisbah bagi hasil ditetapkan 60% untuk pemilik dana dan 40% untuk pengelola, disepakati sebelum akad.\nPengelola wajib menyampaikan laporan usaha setiap bulan.\nKeterlambatan pembayaran dikenakan biaya administrasi Rp50.000 yang menjadi pendapatan platform.\nPara pihak menyetujui akad secara elektronik sebelum pencairan dana.`;
let contract=demo,screened={akad:'Mudharabah',score:75,findings:[]},findings=[],hash='',message='Belum ada approval yang dikomit.',events=[['EVT-001','09:42:18','DPS-01','Approved','Murabahah','8fb2…9c21'],['EVT-002','09:43:04','AI-SCREEN','Flagged','Mudharabah','7e10…1ab4'],['EVT-003','09:44:11','DPS-02','Rejected','Murabahah','31f8…d9a3']];
const tabs=[['overview','▦','Overview'],['screening','⌕','Akad Screening'],['review','◉','DPS Review'],['ledger','◈','Smart Contract'],['audit','≡','Audit Dashboard'],['knowledge','▤','Fatwa Knowledge']];
const norm=s=>s.toLowerCase().replace(/\s+/g,' ');
function scan(s){const t=norm(s),f=[];const mud=/mudharabah|qiradh/.test(t),mur=/murabahah/.test(t),mus=/musyarakah/.test(t);if(mud&&!/(nisbah|rasio).{0,80}(hasil|bagi)/.test(t))f.push({id:'F-001',issue:'Profit-sharing ratio unclear',severity:'high',clause:'Nisbah bagi hasil tidak ditemukan secara eksplisit.',exp:'Akad mudharabah membutuhkan rasio bagi hasil yang disepakati di awal; sistem meminta review DPS.',ref:'DSN-MUI Fatwa 07/DSN-MUI/IV/2000 tentang Pembiayaan Mudharabah (Qiradh)',status:'review'});if(mur&&!/(harga pokok|harga perolehan|cost price)/.test(t))f.push({id:'F-003',issue:'Cost price disclosure missing',severity:'high',clause:'Harga pokok barang belum ditemukan secara jelas.',exp:'Screening tidak menemukan pernyataan eksplisit mengenai harga pokok/perolehan.',ref:'DSN-MUI Fatwa 04/DSN-MUI/IV/2000 tentang Murabahah',status:'review'});if(/(late fee|biaya keterlambatan|denda keterlambatan|keterlambatan).{0,100}(pendapatan|income|platform)/.test(t))f.push({id:'F-002',issue:'Late fee as platform income',severity:'high',clause:s.split(/\n/).find(x=>/keterlambatan|late fee/i.test(x))||'Klausul biaya keterlambatan',exp:'Klausul menyebut biaya keterlambatan menjadi pendapatan platform. Perlu keputusan DPS.',ref:'DSN-MUI Fatwa 117/DSN-MUI/II/2018 — layanan pembiayaan berbasis teknologi informasi berdasarkan prinsip Syariah',status:'review'});if(/bunga|interest|riba/.test(t))f.push({id:'F-004',issue:'Potential riba indicator',severity:'high',clause:'Kata kunci berhubungan dengan bunga/riba terdeteksi.',exp:'Istilah terdeteksi dan perlu diverifikasi bersama konteks transaksinya.',ref:'Fatwa/rule set configured by the institution DPS',status:'review'});if(/judi|taruhan|maysir/.test(t))f.push({id:'F-005',issue:'Potential maysir indicator',severity:'high',clause:'Indikasi istilah perjudian/pertaruhan terdeteksi.',exp:'Sistem menandai istilah terkait maysir untuk pemeriksaan ahli.',ref:'Fatwa/rule set configured by the institution DPS',status:'review'});if(/tidak jelas|sesuai kesepakatan nanti|akan ditentukan kemudian|tergantung kebijakan/.test(t))f.push({id:'F-006',issue:'Potential gharar indicator',severity:'medium',clause:'Wording yang dapat menunjukkan ketidakjelasan terms terdeteksi.',exp:'Klausul diprioritaskan untuk review karena terms tidak dinyatakan jelas.',ref:'Fatwa/rule set configured by the institution DPS',status:'review'});const akad=mud?'Mudharabah':mur?'Murabahah':mus?'Musyarakah':'Akad digital';const p=f.reduce((a,x)=>a+(x.severity==='high'?25:x.severity==='medium'?15:5),0);return{akad,score:Math.max(0,100-p),findings:f}}
async function sha(v){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function go(tab){document.getElementById('pageTitle').textContent=tabs.find(x=>x[0]===tab)[2];document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));({overview:overview,screening:screening,review:review,ledger:ledger,audit:audit,knowledge:knowledge}[tab])();}
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" onclick="go('${t[0]}')"><b>${t[1]}</b><span>${t[2]}</span></button>`).join('');}
function overview(){document.getElementById('content').innerHTML=`<div class="grid"><section class="hero"><div><span class="pill">Competition prototype</span><h2>Continuous Shariah compliance, built around human authority.</h2><p>SHARIAGUARD menggabungkan AI/NLP screening, DPS review, smart-contract enforcement, dan audit trail. AI membantu screening; scholar tetap menjadi otoritas keputusan.</p><div class="actions2"><button class="btn primary" onclick="go('screening')">⌕ Screen an akad</button><button class="btn secondary" onclick="document.getElementById('flow').scrollIntoView({behavior:'smooth'})">See system flow</button></div></div><div class="orbit"><div class="orb"></div><div class="orb b"></div><div class="core">✓</div><span class="node a">AI</span><span class="node b2">DPS</span><span class="node c">CHAIN</span><span class="node d">AUDIT</span></div></section><section class="metrics"><div class="metric"><div class="mi">⌕</div><div><label>Contracts screened</label><strong>120</strong><small>Illustrative sample</small></div></div><div class="metric"><div class="mi">✓</div><div><label>Compliant</label><strong>104</strong><small>No flagged clauses</small></div></div><div class="metric"><div class="mi">!</div><div><label>Flagged for review</label><strong>16</strong><small>DPS queue</small></div></div><div class="metric"><div class="mi">◒</div><div><label>Current demo score</label><strong>${screened.score}%</strong><small>${screened.akad} prototype</small></div></div></section><section id="flow" class="panel"><div class="ph"><div><p class="eyebrow">Architecture</p><h3>Three layers + scholar authority</h3></div><span class="sub">Conceptual implementation</span></div><div class="flow"><div class="flowcard"><span class="fn">01</span><div class="fi">⌕</div><h4>AI / NLP screening</h4><p>Extract clauses and compare them with a verified fatwa knowledge base.</p></div><div class="arrow">→</div><div class="flowcard human"><span class="fn">H</span><div class="fi">◉</div><h4>DPS review</h4><p>Approve, amend, or reject flagged clauses. Human ruling prevails.</p></div><div class="arrow">→</div><div class="flowcard"><span class="fn">02</span><div class="fi">◈</div><h4>Smart contract</h4><p>Lock approved terms and preserve the compliance state.</p></div><div class="arrow">→</div><div class="flowcard"><span class="fn">03</span><div class="fi">≡</div><h4>Audit dashboard</h4><p>Expose status, decisions, and an auditable ledger trail.</p></div></div></section><section class="split"><div class="panel"><div class="ph"><h3>Why this matters</h3></div><div class="why"><div class="reason"><b>Scalability</b><p>Automate routine screening before signing.</p></div><div class="reason"><b>Explainability</b><p>Findings point to a clause and a relevant reference.</p></div><div class="reason"><b>Accountability</b><p>DPS stays identifiable and authoritative.</p></div><div class="reason"><b>Transparency</b><p>Audit events create a shared trail.</p></div></div></div><div class="panel emph"><div class="ph"><h3>Design principle</h3><span>✓</span></div><div class="quote">AI assists with screening; only the Shariah board issues the final ruling.</div><span class="citation">Human-in-the-loop · Ethical AI · Maqasid al-Shariah</span></div></section></div>`}
function screening(){document.getElementById('content').innerHTML=`<div class="grid"><section class="panel screen"><div class="left"><div class="ph"><div><p class="eyebrow">Layer 1</p><h3>Akad draft</h3></div><span class="pill">Pre-signature screening</span></div><textarea id="contract">${contract}</textarea><div class="editorActions"><button class="btn secondary" onclick="document.getElementById('contract').value=demo">Load demo akad</button><button class="btn primary" onclick="runScan()">Run AI screening →</button></div></div><div class="right"><div class="score"><div><p class="eyebrow">AI screening score</p><strong>${screened.score}</strong><small>/100</small></div><div class="ring">${screened.akad}</div></div><div class="eyebrow">Findings</div><div id="findingsBox">${renderFindings(screened.findings)}</div><button class="btn secondary" style="width:100%" onclick="go('review')">Open DPS review queue</button></div></section><div class="info">ⓘ <div><b>Prototype scope.</b> Screening saat ini memakai rule-based deterministic checks agar demo berjalan tanpa API eksternal. Ini bukan production fatwa engine.</div></div></div>`}
function renderFindings(fs){if(!fs.length)return `<div class="info">✓ Tidak ada rule-based flag terdeteksi. Substantive Shariah judgment tetap memerlukan scholar oversight.</div>`;return fs.map(f=>`<div class="finding"><div class="findingtop"><b>${f.issue}</b><span class="risk">${f.severity}</span></div><p>${f.clause}</p><div class="ref"><span>${f.ref}</span><span class="status">${f.status==='approved'?'Approved':'Under DPS Review'}</span></div></div>`).join('')}
function runScan(){contract=document.getElementById('contract').value;screened=scan(contract);findings=screened.findings;screening()}
function review(){document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Human authority</p><h3>DPS review queue</h3></div><span class="pill">Role: DPS</span></div><div class="info">◉ <div><b>Scholar-led decision.</b> AI findings are evidence for review, not final rulings. DPS decision is authoritative in this prototype.</div></div>${findings.length?findings.map(f=>`<article class="reviewcard"><div class="reviewtop"><div><span class="case">${f.id}</span><h4>${f.issue}</h4></div><span class="risk">${f.severity}</span></div><div class="cols"><div><span class="field">Flagged clause</span><p>${f.clause}</p></div><div><span class="field">AI explanation</span><p>${f.exp}</p></div></div><div class="refbox">${f.ref}</div><div class="reviewActions"><span class="status" id="st-${f.id}">${f.status==='review'?'Under DPS Review':f.status}</span><div><button class="btn secondary" onclick="reject('${f.id}')">Reject</button><button class="btn primary" onclick="approve('${f.id}')">Approve & encode</button></div></div></article>`).join(''):`<div class="info">No items in queue. Jalankan screening terlebih dahulu.</div>`}</div>`}
function reject(id){findings=findings.map(f=>f.id===id?{...f,status:'rejected'}:f);review()}
async function approve(id){findings=findings.map(f=>f.id===id?{...f,status:'approved'}:f);const h=await sha(contract+'|'+id+'|APPROVED|'+Date.now());hash=h;events.unshift(['EVT-'+String(events.length+1).padStart(3,'0'),new Date().toLocaleTimeString('en-GB'),'DPS-01','Approved',screened.akad,h.slice(0,4)+'…'+h.slice(-4)]);message='DPS decision prepared. Approved terms are ready to commit to the permissioned ledger.';ledger()}
async function commit(){const h=hash||await sha(contract+'|'+screened.akad+'|COMMIT|'+Date.now());hash=h;events.unshift(['EVT-'+String(events.length+1).padStart(3,'0'),new Date().toLocaleTimeString('en-GB'),'LEDGER','Committed',screened.akad,h.slice(0,4)+'…'+h.slice(-4)]);message='Committed to prototype ledger. SHA-256 is used here to simulate an immutable audit record; this is not a production blockchain network.';ledger()}
function ledger(){document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Layer 2</p><h3>Smart contract enforcement</h3></div><span class="pill">Permissioned</span></div><div class="ledgercards"><div class="ledgercard"><span>Akad</span><h4>${screened.akad}</h4><small>Approved terms</small></div><div class="ledgercard"><span>Ledger mode</span><h4>Permissioned</h4><small>Authorized validators only</small></div><div class="ledgercard"><span>Privacy</span><h4>Off-chain PII</h4><small>Hashes / status on ledger</small></div></div><div class="hash"><div><label>Contract content hash</label><code>${hash||'Not generated yet'}</code></div><button class="btn primary" onclick="commit()">${hash?'Commit record':'Generate & commit'} →</button></div><div class="note">${message}</div><div class="ph" style="margin-top:18px"><h3>Locked terms preview</h3><span class="sub">Conceptual smart-contract payload</span></div><pre class="payload">${JSON.stringify({akad:screened.akad,status:'DPS_APPROVED',enforce:['approved_terms','profit_sharing_or_margin','late_fee_policy'],contract_hash:hash||'pending'},null,2)}</pre><div class="warn">⚠ Presentation prototype: ledger immutability is simulated with SHA-256. Production would connect this stage to a permissioned blockchain such as Hyperledger Fabric.</div></div>`}
function audit(){const q=norm((document.getElementById('auditQ')?.value||''));const rows=events.filter(e=>!q||norm(e.join(' ')).includes(q));document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Layer 3</p><h3>Audit dashboard</h3></div><span class="sub">DPS · Auditor · Regulator</span></div><div class="auditSummary"><div class="metric"><div class="mi">⌕</div><div><label>Contracts screened</label><strong>120</strong><small>Illustrative sample</small></div></div><div class="metric"><div class="mi">✓</div><div><label>Compliant</label><strong>104</strong><small>87% of sample</small></div></div><div class="metric"><div class="mi">!</div><div><label>Flagged</label><strong>16</strong><small>Active review set</small></div></div></div><div class="toolbar"><div class="search">⌕ <input id="auditQ" placeholder="Search audit event" value="${q}" oninput="audit()"></div><span class="sub">${rows.length} event(s)</span></div><div class="tablewrap"><table><thead><tr><th>Event</th><th>Time</th><th>Actor</th><th>Action</th><th>Akad</th><th>Hash</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td><code>${r[5]}</code></td></tr>`).join('')}</tbody></table></div></div>`}
function knowledge(){document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Verified knowledge base</p><h3>Fatwa references in prototype</h3></div><span class="pill">RAG-ready structure</span></div><div class="knowl"><div class="kcard"><div class="kicon">▤</div><span class="case">DSN-MUI</span><h4>Murabahah</h4><code>04/DSN-MUI/IV/2000</code><p>Referenced for cost-price and margin disclosure screening.</p><div class="kfoot"><span>Structured reference</span><span>✓</span></div></div><div class="kcard"><div class="kicon">▤</div><span class="case">DSN-MUI</span><h4>Mudharabah</h4><code>07/DSN-MUI/IV/2000</code><p>Referenced for profit-sharing ratio screening.</p><div class="kfoot"><span>Structured reference</span><span>✓</span></div></div><div class="kcard"><div class="kicon">▤</div><span class="case">DSN-MUI</span><h4>Technology-based financing</h4><code>117/DSN-MUI/II/2018</code><p>Used as the reference in the digital-financing review example.</p><div class="kfoot"><span>Structured reference</span><span>✓</span></div></div></div><div class="info" style="margin-top:15px">▤ <div><b>Next implementation step.</b> Convert approved fatwa sources into machine-readable rules and connect retrieval to the screening engine.</div></div></div>`}
nav();go('overview');
</script>
</body></html>
