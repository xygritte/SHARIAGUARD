lor:#9ea9c5;font-size:8px}.knowl{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.kcard{border:1px solid var(--line);background:#141a31;border-radius:11px;padding:14px}.kicon{font-size:20px}.kcard .case{margin-top:12px}.kcard h4{font-size:13px;margin:5px 0}.kcard code{font-size:8px;color:#a59fff}.kcard p{font-size:9px;color:#99a4bf;line-height:1.5;min-height:55px}.kfoot{border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;font-size:8px;color:#7f89a4}.modal{position:fixed;inset:0;background:rgba(2,4,12,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line);background:#10162c;border-radius:16px;padding:20px;box-shadow:0 25px 80px rgba(0,0,0,.4)}.modalhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.x{border:0;background:#171d34;color:#bac2d8;border-radius:9px;padding:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px}.fieldbox{display:grid;gap:6px}.fieldbox.full{grid-column:1/-1}.fieldbox label{font-size:9px;color:#8690aa}.fieldbox input,.fieldbox select,.fieldbox textarea{min-height:auto;height:40px;padding:10px;background:#0b1022;border:1px solid var(--line);color:#fff;border-radius:9px}.fieldbox textarea{height:90px}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.legend span{font-size:8px;padding:5px 7px;border:1px solid var(--line);border-radius:999px;color:#a9b2c9}.progress{height:7px;border-radius:99px;background:#171d33;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7d70ff,#73d3a5);width:0;transition:width .4s}.sim{display:grid;gap:9px}.simrow{display:grid;grid-template-columns:140px 1fr 90px;gap:10px;align-items:center;background:#13192f;border:1px solid var(--line);padding:10px;border-radius:10px}.simrow span{font-size:9px;color:#aab3ca}.mini{font-size:9px;color:#8c97b4}.empty{padding:28px;text-align:center;color:#8993ae;border:1px dashed var(--line);border-radius:12px}.toast{position:fixed;right:20px;bottom:20px;background:#141b32;border:1px solid var(--line);padding:12px 14px;border-radius:11px;color:#dce2f1;font-size:10px;display:none;z-index:20;box-shadow:0 15px 40px rgba(0,0,0,.3)}.toast.show{display:block}.mini-btn{padding:7px 9px;font-size:9px;border-radius:8px}.approval-banner{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid rgba(115,211,165,.18);background:rgba(115,211,165,.05);border-radius:11px;margin:12px 0}.approval-banner b{font-size:10px}.approval-banner span{font-size:9px;color:#9fb7aa}@media(max-width:1000px){.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px);padding:20px}.hero{grid-template-columns:1fr}.orbit{display:none}.metrics{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.screen{grid-template-columns:1fr}.right{border-left:0;border-top:1px solid var(--line)}.flow{flex-wrap:wrap}.arrow{display:none}.flowcard{min-width:230px}.knowl{grid-template-columns:1fr}}@media(max-width:680px){.side{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}.app{display:block}.main{width:100%;margin:0;padding:15px}.tag,.sidefoot,.brand small{display:none}.nav{grid-template-columns:repeat(6,1fr)}.nav button{justify-content:center;padding:10px}.nav button span{display:none}.brand{justify-content:center}.brand b{display:none}.top{align-items:flex-start;gap:10px}.live{display:none}.metrics,.why,.ledgercards,.auditSummary,.cols,.formgrid{grid-template-columns:1fr}.hero{padding:21px}.hero h2{font-size:28px}.hash{flex-direction:column;align-items:flex-start}.simrow{grid-template-columns:1fr}}
 .stepper{display:flex;align-items:center;gap:7px;margin:0 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(17,23,45,.58);overflow:auto}.stepper i{height:1px;min-width:14px;flex:1;background:var(--line)}.step{border:0;background:transparent;color:#7f89a5;display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:10px;padding:4px}.step span{width:23px;height:23px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:9px}.step.current{color:#fff}.step.current span{background:var(--purple);border-color:var(--purple)}.step.done{color:var(--green)}.step.done span{border-color:rgba(115,211,165,.4)}button:disabled{opacity:.4;cursor:not-allowed}.reason:hover,.flowcard:hover,.kcard:hover{border-color:rgba(119,105,255,.4);transform:translateY(-1px);transition:transform .18s,border-color .18s}@media(max-width:680px){.stepper{gap:3px}.step{font-size:9px;padding:3px}.step span{width:20px;height:20px}}\n</style>

<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="mark">✓</div><div><b>SHARIAGUARD</b><small>Scholar-Led · AI-Screened</small></div></div>
  
  <div class="nav" id="nav"></div>

</aside>
<main class="main">
<header class="top"><div><p class="eyebrow">Islamic fintech · Digital Shariah governance</p><h1 id="pageTitle">Overview</h1></div><div class="actions"><span class="live">Shariah governance</span><button class="btn primary" onclick="startDemo()">Try sample akad</button></div></header>
<div id="content"></div>
</main>
</div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY='shariaguard-prototype-v2';
const demo=`AKAD MUDHARABAH PEMBIAYAAN DIGITAL

Pemilik dana menyediakan modal sebesar Rp20.000.000 kepada pengelola usaha.
Nisbah bagi hasil ditetapkan 60% untuk pemilik dana dan 40% untuk pengelola, disepakati sebelum akad.
Pengelola wajib menyampaikan laporan usaha setiap bulan.
Keterlambatan pembayaran dikenakan biaya administrasi Rp50.000 yang menjadi pendapatan platform.
Para pihak menyetujui akad secara elektronik sebelum pencairan dana.`;

const defaultState={contract:'',selectedAkad:'Mudharabah',screened:{akad:'Belum dipilih',score:100,findings:[]},findings:[],hash:'',status:'EMPTY',events:[],contracts:[],settings:{institution:'SHARIAGUARD',dpsName:'DPS Reviewer'}};

function loadState(){
  try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)); return x?{...defaultState,...x}:structuredClone(defaultState)}
  catch(e){return structuredClone(defaultState)}
}
let state=loadState();
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function scan(s){
  const t=norm(s), f=[];
  const mud=/mudharabah|qiradh/.test(t), mur=/murabahah/.test(t), mus=/musyarakah/.test(t);
  if(mud&&!/(nisbah|rasio).{0,80}(hasil|bagi)/.test(t))
    f.push({id:'F-001',issue:'Profit-sharing ratio unclear',severity:'high',clause:'Nisbah bagi hasil tidak ditemukan secara eksplisit.',exp:'Akad mudharabah membutuhkan rasio bagi hasil yang disepakati di awal; sistem meminta review DPS.',ref:'DSN-MUI Fatwa 07/DSN-MUI/IV/2000 tentang Pembiayaan Mudharabah (Qiradh)',status:'review'});
  if(mur&&!/(harga pokok|harga perolehan|cost price)/.test(t))
    f.push({id:'F-003',issue:'Cost price disclosure missing',severity:'high',clause:'Harga pokok barang belum ditemukan secara jelas.',exp:'Screening tidak menemukan pernyataan eksplisit mengenai harga pokok/perolehan.',ref:'DSN-MUI Fatwa 04/DSN-MUI/IV/2000 tentang Murabahah',status:'review'});
  if(/(late fee|biaya keterlambatan|denda keterlambatan|keterlambatan).{0,100}(pendapatan|income|platform)/.test(t))
    f.push({id:'F-002',issue:'Late fee as platform income',severity:'high',clause:s.split(/\n/).find(x=>/keterlambatan|late fee/i.test(x))||'Klausul biaya keterlambatan',exp:'Klausul menyebut biaya keterlambatan menjadi pendapatan platform. Perlu keputusan DPS.',ref:'DSN-MUI Fatwa 117/DSN-MUI/II/2018 — layanan pembiayaan berbasis teknologi informasi berdasarkan prinsip Syariah',status:'review'});
  if(/\b(bunga|interest|riba)\b/.test(t))
    f.push({id:'F-004',issue:'Potential riba indicator',severity:'high',clause:'Kata kunci berhubungan dengan bunga/riba terdeteksi.',exp:'Istilah terdeteksi dan perlu diverifikasi bersama konteks transaksinya.',ref:'Fatwa/rule set configured by the institution DPS',status:'review'});
  if(/\b(judi|taruhan|maysir)\b/.test(t))
    f.push({id:'F-005',issue:'Potential maysir indicator',severity:'high',clause:'Indikasi istilah perjudian/pertaruhan terdeteksi.',exp:'Sistem menandai istilah terkait maysir untuk pemeriksaan ahli.',ref:'Fatwa/rule set configured by the institution DPS',status:'review'});
  if(/tidak jelas|sesuai kesepakatan nanti|akan ditentukan kemudian|tergantung kebijakan/.test(t))
    f.push({id:'F-006',issue:'Potential gharar indicator',severity:'medium',clause:'Wording yang dapat menunjukkan ketidakjelasan terms terdeteksi.',exp:'Klausul diprioritaskan untuk review karena terms tidak dinyatakan jelas.',ref:'Fatwa/rule set configured by the institution DPS',status:'review'});
  const akad=mud?'Mudharabah':mur?'Murabahah':mus?'Musyarakah':'Akad digital';
  const penalty=f.reduce((a,x)=>a+(x.severity==='high'?25:x.severity==='medium'?15:5),0);
  return{akad,score:Math.max(0,100-penalty),findings:f}
}

async function sha(v){
  const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

const tabs=[['overview','▦','Overview'],['screening','⌕','Akad Screening'],['review','◉','DPS Review'],['ledger','◈','Smart Contract'],['audit','≡','Audit Dashboard'],['knowledge','▤','Fatwa Knowledge']];
function nav(){
  document.getElementById('nav').innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" onclick="go('${t[0]}')"><b>${t[1]}</b><span>${t[2]}</span></button>`).join('');
}
function go(tab){
  document.getElementById('pageTitle').textContent=tabs.find(x=>x[0]===tab)[2];
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
  ({overview,screening,review,ledger,audit,knowledge}[tab]||overview)();
  renderStepper(tab);
}
function renderStepper(tab){
  var steps=[['screening','Akad draft'],['screening','Screening'],['review','DPS review'],['ledger','Akad record'],['audit','Audit trail']];
  var current=({overview:0,screening:1,review:2,ledger:3,audit:4,knowledge:0})[tab]||0;
  var html='<div class="stepper">';
  steps.forEach(function(s,i){html+='<button class="step '+(i===current?'current':i<current?'done':'')+'" onclick="go(\''+s[0]+'\')"><span>'+(i<current?'✓':i+1)+'</span>'+s[1]+'</button>';if(i<steps.length-1)html+='<i></i>';});
  html+='</div>';document.getElementById('content').insertAdjacentHTML('afterbegin',html);
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function overview(){
  const pending=state.findings.filter(f=>f.status==='review').length;
  document.getElementById('content').innerHTML=`<div class="grid">
  <section class="hero"><div><span class="pill">Digital Shariah governance</span><h2>Make every akad easier to review and verify.</h2><p>Screen contract terms, route potential issues to the Shariah board, and keep a traceable record of decisions.</p><div class="actions2"><button class="btn primary" onclick="go('screening')">⌕ Screen an akad</button><button class="btn secondary" onclick="document.getElementById('flow').scrollIntoView({behavior:'smooth'})">See system flow</button></div></div><div class="orbit"><div class="orb"></div><div class="orb b"></div><div class="core">✓</div><span class="node a">AI</span><span class="node b2">DPS</span><span class="node c">CHAIN</span><span class="node d">AUDIT</span></div></section>
  <section class="metrics">
    <div class="metric"><div class="mi">⌕</div><div><label>Total records</label><strong>${state.contracts.length}</strong><small>Browser-local dataset</small></div></div>
    <div class="metric"><div class="mi">✓</div><div><label>Approved</label><strong>${state.contracts.filter(c=>c.status==='Approved').length}</strong><small>Decision by DPS</small></div></div>
    <div class="metric"><div class="mi">!</div><div><label>Pending review</label><strong>${state.contracts.filter(c=>c.status==='Under DPS Review').length+pending}</strong><small>Action required</small></div></div>
    <div class="metric"><div class="mi">◒</div><div><label>Current AI score</label><strong>${state.screened.score}%</strong><small>${esc(state.screened.akad)}</small></div></div>
  </section>
  <section id="flow" class="panel"><div class="ph"><div><p class="eyebrow">Architecture</p><h3>Three layers + scholar authority</h3></div><span class="sub">Interactive browser prototype</span></div><div class="flow">
    <div class="flowcard"><span class="fn">01</span><div class="fi">⌕</div><h4>AI / NLP screening</h4><p>Extract clauses and compare them with structured fatwa references.</p></div><div class="arrow">→</div>
    <div class="flowcard human"><span class="fn">H</span><div class="fi">◉</div><h4>DPS review</h4><p>Approve, amend, or reject flagged clauses. Human ruling prevails.</p></div><div class="arrow">→</div>
    <div class="flowcard"><span class="fn">02</span><div class="fi">◈</div><h4>Smart contract</h4><p>Create a content hash and simulate committing approved terms.</p></div><div class="arrow">→</div>
    <div class="flowcard"><span class="fn">03</span><div class="fi">≡</div><h4>Audit dashboard</h4><p>Inspect events, actor, action, akad, and record hash.</p></div>
  </div></section>
  <section class="split"><div class="panel"><div class="ph"><h3>Demo controls</h3><span class="sub">Useful during judging</span></div><div class="why">
    <div class="reason" style="cursor:pointer" onclick="newContract()"><b>New akad</b><p>Create a new local contract record.</p></div>
    <div class="reason" style="cursor:pointer" onclick="exportData()"><b>Export data</b><p>Download browser-local state as JSON.</p></div>
    <div class="reason" style="cursor:pointer" onclick="resetData()"><b>Reset demo</b><p>Restore the competition baseline.</p></div>
    <div class="reason" style="cursor:pointer" onclick="go('audit')"><b>Live audit</b><p>Show judges the event trail.</p></div>
  </div></div>
  <div class="panel emph"><div class="ph"><h3>Design principle</h3><span>✓</span></div><div class="quote">AI assists with screening; only the Shariah board issues the final ruling.</div><span class="citation">Human-in-the-loop · Ethical AI · Maqasid al-Shariah</span></div></section>
  </div>`
}

function screening(){
  document.getElementById('content').innerHTML=`<div class="grid"><section class="panel screen">
  <div class="left"><div class="ph"><div><p class="eyebrow">Layer 1</p><h3>Akad draft</h3></div><span class="pill">Pre-signature screening</span></div>
  <textarea id="contract">${esc(state.contract)}</textarea>
  <div class="editorActions"><button class="btn secondary" onclick="document.getElementById('contract').value=demo">Load demo akad</button><button class="btn primary" onclick="runScan()">Run AI screening →</button></div>
  <div class="legend"><span>Clause screening</span><span>Reference-linked findings</span><span>DPS review required</span></div></div>
  <div class="right"><div class="score"><div><p class="eyebrow">AI screening score</p><strong>${state.screened.score}</strong><small>/100</small></div><div class="ring">${esc(state.screened.akad)}</div></div>
  <div class="eyebrow">Findings</div><div>${renderFindings(state.screened.findings)}</div>
  <button class="btn secondary" style="width:100%;margin-top:8px" onclick="go('review')">Open DPS review queue</button></div></section>
  <div class="info">ⓘ <div><b>Review note.</b> Findings are indicators for qualified review, not a final Shariah ruling.</div></div></div>`
}
function renderFindings(fs){
  if(!fs.length)return '<div class="empty">✓ Tidak ada rule-based flag terdeteksi. Substantive Shariah judgment tetap memerlukan scholar oversight.</div>';
  return fs.map(f=>{
    const st=f.status==='approved'?'<span class="status ok">Approved</span>':f.status==='rejected'?'<span class="status bad">Rejected</span>':'<span class="status">Under DPS Review</span>';
    return `<div class="finding"><div class="findingtop"><b>${esc(f.issue)}</b><span class="risk">${esc(f.severity)}</span></div><p>${esc(f.clause)}</p><div class="ref"><span>${esc(f.ref)}</span>${st}</div></div>`
  }).join('')
}
function runScan(){
  state.contract=document.getElementById('contract').value.trim();
  if(!state.contract){toast('Masukkan teks akad terlebih dahulu.');return;}
  state.screened=scan(state.contract);
  state.findings=state.screened.findings;
  state.status='SCREENED';
  state.events.unshift(['EVT-'+String(state.events.length+1).padStart(3,'0'),new Date().toLocaleTimeString('en-GB'),'AI-SCREEN','Flagged',state.screened.akad,'—']);
  persist();screening();toast('Screening selesai — temuan siap untuk DPS.')
}

function review(){
  const fs=state.findings;
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Human authority</p><h3>DPS review queue</h3></div><span class="pill">Decision queue</span></div>
  <div class="info">◉ <div><b>Scholar-led decision.</b> AI findings are evidence for review, not final rulings. DPS decision is authoritative in this prototype.</div></div>
  ${fs.length?fs.map(f=>reviewCard(f)).join(''):'<div class="empty">No items in queue. Jalankan screening terlebih dahulu.</div>'}</div>`
}
function reviewCard(f){
  return `<article class="reviewcard"><div class="reviewtop"><div><span class="case">${esc(f.id)}</span><h4>${esc(f.issue)}</h4></div><span class="risk">${esc(f.severity)}</span></div>
  <div class="cols"><div><span class="field">Flagged clause</span><p>${esc(f.clause)}</p></div><div><span class="field">AI explanation</span><p>${esc(f.exp)}</p></div></div>
  <div class="refbox">${esc(f.ref)}</div>
  <div class="reviewActions"><span class="status ${f.status==='approved'?'ok':f.status==='rejected'?'bad':''}">${f.status==='review'?'Under DPS Review':esc(f.status)}</span>
  <div><button class="btn secondary mini-btn" onclick="rejectFinding('${f.id}')">Reject</button><button class="btn primary mini-btn" onclick="approveFinding('${f.id}')">Approve & encode</button></div></div></article>`
}
function rejectFinding(id){
  state.findings=state.findings.map(f=>f.id===id?{...f,status:'rejected'}:f);
  state.status='DPS_REJECTED';
  state.events.unshift(['EVT-'+String(state.events.length+1).padStart(3,'0'),new Date().toLocaleTimeString('en-GB'),state.settings.dpsName,'Rejected',state.screened.akad,'—']);
  persist();review();toast('DPS rejection recorded locally.')
}
async function approveFinding(id){
  if(state.findings.some(f=>f.status==='review')){toast('Tinjau semua temuan sebelum menyetujui akad.');return;}
  state.findings=state.findings.map(f=>f.id===id?{...f,status:'approved'}:f);
  const h=await sha(state.contract+'|'+id+'|APPROVED|'+Date.now());
  state.hash=h;state.status='DPS_APPROVED';
  state.events.unshift(['EVT-'+String(state.events.length+1).padStart(3,'0'),new Date().toLocaleTimeString('en-GB'),state.settings.dpsName,'Approved',state.screened.akad,h.slice(0,4)+'…'+h.slice(-4)]);
  const rec=state.contracts.find(c=>c.id==='C-002');
  if(rec){rec.status='Approved';rec.risk='Reviewed';rec.hash=h.slice(0,4)+'…'+h.slice(-4)}
  persist();ledger();toast('DPS approval recorded. Terms siap di-encode.')
}

function ledger(){
  const approved=state.findings.length>0 && state.findings.every(f=>f.status==='approved');
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Layer 2</p><h3>Smart contract enforcement</h3></div><span class="pill">Akad integrity</span></div>
  ${approved?'<div class="approval-banner"><div><b>✓ DPS approval available</b><span>Approved findings can now be committed as a local ledger record.</span></div><span class="status ok">READY</span></div>':'<div class="info">Belum ada finding yang di-approve oleh DPS. Kembali ke DPS Review untuk membuat approval.</div>'}
  <div class="ledgercards"><div class="ledgercard"><span>Akad</span><h4>${esc(state.screened.akad)}</h4><small>Approved terms only</small></div><div class="ledgercard"><span>Ledger mode</span><h4>Browser-local</h4><small>Prototype simulation</small></div><div class="ledgercard"><span>Privacy</span><h4>Off-chain PII</h4><small>No PII written here</small></div></div>
  <div class="hash"><div><label>Contract content hash</label><code>${state.hash||'Not generated yet'}</code></div><button class="btn primary" onclick="commitRecord()" ${approved?'':'disabled'}>${state.hash?'Commit record':'Generate & commit'} →</button></div>
  <div class="note">${state.status==='COMMITTED'?'Record committed to browser-local audit ledger.':'SHA-256 is used as a deterministic content fingerprint for the prototype.'}</div>
  <div class="ph" style="margin-top:18px"><h3>Locked terms preview</h3><span class="sub">Conceptual smart-contract payload</span></div>
  <pre class="payload">${esc(JSON.stringify({akad:state.screened.akad,status:state.status,enforce:['approved_terms','profit_sharing_or_margin','late_fee_policy'],contract_hash:state.hash||'pending'},null,2))}</pre>
  <div class="note">A SHA-256 fingerprint helps identify changes to contract text; it is not proof of a live blockchain transaction.</div></div>`
}
async function commitRecord(){
  if(state.status==='COMMITTED'){toast('Akad ini sudah dicatat.');return;}
  if(!state.findings.length || !state.findings.every(f=>f.status==='approved')){toast('Semua temuan harus disetujui DPS terlebih dahulu.');return;}
  if(!state.hash)state.hash=await sha(state.contract+'|'+state.screened.akad+'|COMMIT|'+Date.now());
  state.status='COMMITTED';
  state.events.unshift(['EVT-'+String(state.events.length+1).padStart(3,'0'),new Date().toLocaleTimeString('en-GB'),'LEDGER','Committed',state.screened.akad,state.hash.slice(0,4)+'…'+state.hash.slice(-4)]);
  const id='C-'+String(state.contracts.length+1).padStart(3,'0');
  state.contracts.unshift({id,akad:state.screened.akad,status:'Approved',risk:'Verified',owner:'Browser Demo',date:new Date().toISOString().slice(0,10),hash:state.hash.slice(0,4)+'…'+state.hash.slice(-4)});
  persist();ledger();toast('Ledger commit recorded.')
}

function audit(){
  const q=norm((document.getElementById('auditQ')?.value||''));
  const rows=state.events.filter(e=>!q||norm(e.join(' ')).includes(q));
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Layer 3</p><h3>Audit dashboard</h3></div><span class="sub">DPS · Auditor · Regulator</span></div>
  <div class="auditSummary"><div class="metric"><div class="mi">⌕</div><div><label>Events</label><strong>${state.events.length}</strong><small>Browser-local</small></div></div><div class="metric"><div class="mi">✓</div><div><label>Committed records</label><strong>${state.events.filter(e=>e[3]==='Committed').length}</strong><small>Ledger simulation</small></div></div><div class="metric"><div class="mi">!</div><div><label>Findings</label><strong>${state.findings.length}</strong><small>Current akad</small></div></div></div>
  <div class="toolbar"><div class="search">⌕ <input id="auditQ" placeholder="Search audit event" value="${esc(q)}" oninput="audit()"></div><span class="sub">${rows.length} event(s)</span></div>
  <div class="tablewrap"><table><thead><tr><th>Event</th><th>Time</th><th>Actor</th><th>Action</th><th>Akad</th><th>Hash</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td><code>${esc(r[5])}</code></td></tr>`).join('')}</tbody></table></div>
  <div class="info">🔎 <div><b>Traceability.</b> Event actor, action, akad, and content fingerprint stay visible so the demo can show an end-to-end audit trail.</div></div></div>`
}

function knowledge(){
  document.getElementById('content').innerHTML=`<div class="panel"><div class="ph"><div><p class="eyebrow">Verified knowledge base</p><h3>Fatwa references in prototype</h3></div><span class="pill">Reference library</span></div>
  <div class="knowl"><div class="kcard"><div class="kicon">▤</div><span class="case">DSN-MUI</span><h4>Murabahah</h4><code>04/DSN-MUI/IV/2000</code><p>Referenced for cost-price and margin disclosure screening.</p><div class="kfoot"><span>Reference listed</span><span>↗</span></div></div>
  <div class="kcard"><div class="kicon">▤</div><span class="case">DSN-MUI</span><h4>Mudharabah</h4><code>07/DSN-MUI/IV/2000</code><p>Referenced for profit-sharing ratio screening.</p><div class="kfoot"><span>Structured reference</span><span>✓</span></div></div>
  <div class="kcard"><div class="kicon">▤</div><span class="case">DSN-MUI</span><h4>Technology-based financing</h4><code>117/DSN-MUI/II/2018</code><p>Used as the reference in the digital-financing review example.</p><div class="kfoot"><span>Structured reference</span><span>✓</span></div></div></div>
  <div class="info" style="margin-top:15px">▤ <div><b>Use in review.</b> Verify the applicable fatwa text and clause interpretation before making a decision.</div></div></div>`
}

function newContract(){
  openModal(`<div class="modalhead"><div><p class="eyebrow">Create local record</p><h3>New akad draft</h3></div><button class="x" onclick="closeModal()">✕</button></div>
  <div class="formgrid"><div class="fieldbox"><label>Akad type</label><select id="newAkad"><option>Mudharabah</option><option>Murabahah</option><option>Musyarakah</option><option>Akad digital</option></select></div><div class="fieldbox"><label>Customer / owner</label><input id="newOwner" value="Demo Customer"></div><div class="fieldbox full"><label>Contract text</label><textarea id="newText">${esc(demo)}</textarea></div></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNewContract()">Create & screen</button></div>`)
}
function saveNewContract(){
  state.contract=document.getElementById('newText').value;
  state.selectedAkad=document.getElementById('newAkad').value;
  state.screened=scan(state.contract);state.findings=state.screened.findings;state.status='DRAFT';
  const id='C-'+String(Math.max(1,state.contracts.length+1)).padStart(3,'0');
  state.contracts.unshift({id,akad:state.screened.akad,status:state.findings.length?'Under DPS Review':'Ready',risk:state.findings.length?'High':'Low',owner:document.getElementById('newOwner').value,date:new Date().toISOString().slice(0,10),hash:'—'});
  state.events.unshift(['EVT-'+String(state.events.length+1).padStart(3,'0'),new Date().toLocaleTimeString('en-GB'),'USER','Created',state.screened.akad,'—']);
  persist();closeModal();screening();toast('Akad baru dibuat di browser-local storage.')
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shariaguard-local-data.json';a.click();URL.revokeObjectURL(a.href);
  toast('Data diekspor sebagai JSON.')
}
function resetData(){
  if(!confirm('Reset seluruh data prototype di browser?'))return;
  state=structuredClone(defaultState);persist();go('overview');toast('Prototype dikembalikan ke baseline.')
}
function startDemo(){
  state.contract=demo;state.screened=scan(demo);state.findings=state.screened.findings;state.hash='';state.status='SCREENED';persist();go('screening');toast('Demo scenario loaded. Jalankan screening untuk mulai.')
}
nav();go('overview');
</script>
